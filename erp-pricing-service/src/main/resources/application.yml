server:
  port: 8087

spring:
  config:
    # ⚠️ 必须有这行：classpath 上有 spring-cloud-starter-alibaba-nacos-config 时，
    #    Spring Cloud 的 ConfigDataMissingEnvironmentPostProcessor 会检查
    #    spring.config.import，没配就直接抛 "No spring.config.import set" → 服务起不来。
    #    optional: 前缀表示 Nacos 不可达时不阻塞启动（降级用本地配置）。
    import:
      - optional:nacos:${spring.application.name}.yml
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_HOST:127.0.0.1}:${NACOS_PORT:8848}
        namespace: ${NACOS_NAMESPACE:erp-dev}
        group: DEFAULT_GROUP
      config:
        server-addr: ${NACOS_HOST:127.0.0.1}:${NACOS_PORT:8848}
        namespace: ${NACOS_NAMESPACE:erp-dev}
        group: DEFAULT_GROUP
        file-extension: yml
        refresh-enabled: true
  application:
    name: erp-pricing-service

  # ⚠️ 之前 pricing-service 完全没有 datasource 配置，但 pom 里引了
  #    mybatis-plus + mysql-connector —— 实体和 SQL 表都在，却从来没连过库，
  #    Service 里全是内存 mock。现在接上真实持久层。
  #    注意：变量名必须和 compose 注入的一致（MYSQL_HOST / MYSQL_PORT），
  #    写死 localhost 会导致容器里连不上库（这个坑踩过）。
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/erp_pricing?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# Swagger配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# 应用配置
app:
  name: 智能定价服务
  version: 1.5.0
  author: 火球鼠
