server:
  port: 8087

spring:
  config:
    # ⚠️ 必须有这行：classpath 上有 spring-cloud-starter-alibaba-nacos-config 时，
    #    Spring Cloud 的 ConfigDataMissingEnvironmentPostProcessor 会检查
    #    spring.config.import，没配就直接抛 "No spring.config.import set" → 服务起不来。
    #    optional: 前缀表示 Nacos 不可达时不阻塞启动（降级用本地配置）。
    import:
      - optional:nacos:${spring.application.name}.yml
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_HOST:127.0.0.1}:${NACOS_PORT:8848}
        namespace: ${NACOS_NAMESPACE:erp-dev}
        group: DEFAULT_GROUP
      config:
        server-addr: ${NACOS_HOST:127.0.0.1}:${NACOS_PORT:8848}
        namespace: ${NACOS_NAMESPACE:erp-dev}
        group: DEFAULT_GROUP
        file-extension: yml
        refresh-enabled: true
  application:
    name: erp-pricing-service

  # ⚠️ 之前 pricing-service 完全没有 datasource 配置，但 pom 里引了
  #    mybatis-plus + mysql-connector —— 实体和 SQL 表都在，却从来没连过库，
  #    Service 里全是内存 mock。现在接上真实持久层。
  #    注意：变量名必须和 compose 注入的一致（MYSQL_HOST / MYSQL_PORT），
  #    写死 localhost 会导致容器里连不上库（这个坑踩过）。
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/erp_pricing?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# Swagger配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# 📌 **AI 能力（可选，默认关闭）** —— 定价建议的「建议原因」由 LLM 生成
#    📌 **数字仍由确定性规则算**（竞品 + 成本 + 需求加权）→ 不调用 LLM、可复现；
#       LLM 只负责把因子翻译成一句人话解释。
#    📌 默认值**必须与 LLMConfig 的类默认值逐字一致**（不一致 = 其中一处是死代码）。
#    📌 端点拼接 / 请求头 / 响应解析 / token 用量全部走 `erp-llm-common` 的 LLMEndpointResolver。
llm:
  # 是否启用真实API调用（配置API Key后设为true）
  enabled: ${LLM_ENABLED:false}
  # API Key（支持环境变量：LLM_API_KEY / DEEPSEEK_API_KEY / OPENAI_API_KEY）
  api-key: ${LLM_API_KEY:${DEEPSEEK_API_KEY:${OPENAI_API_KEY:}}}
  # API Base URL
  # 📌 **API 根地址**（唯一事实来源 = LLMEndpointResolver，带不带 /v1 都行）
  base-url: ${LLM_BASE_URL:https://api.deepseek.com}
  # 模型名称
  model: ${LLM_MODEL:deepseek-chat}
  # 请求超时（毫秒）
  timeout: ${LLM_TIMEOUT:30000}
  # 最大Token数
  max-tokens: ${LLM_MAX_TOKENS:2000}
  # Temperature
  temperature: ${LLM_TEMPERATURE:0.7}
  # Provider: deepseek, openai, azure, ollama, openai-compatible, anthropic
  provider: ${LLM_PROVIDER:deepseek}
  # Azure 专用（provider=azure 时必填）
  deployment: ${LLM_DEPLOYMENT:}
  api-version: ${LLM_API_VERSION:}

# 应用配置
app:
  name: 智能定价服务
  version: 1.5.0
  author: 火球鼠
