server:
  port: 0

spring:
  application:
    name: erp-user-service-test
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:user_test;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ''
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  data:
    redis:
      host: localhost
      port: 6379
      database: 2
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
        import-check:
          enabled: false
    sentinel:
      enabled: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: cross-border-erp-secret-key-2024
  expiration: 86400000

management:
  endpoints:
    web:
      exposure:
        include: '*'
