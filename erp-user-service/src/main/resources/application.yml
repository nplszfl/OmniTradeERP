server:
  port: 8084

spring:
  config:
    # ⚠️ 必须有这行：classpath 上有 spring-cloud-starter-alibaba-nacos-config 时，
    #    Spring Cloud 的 ConfigDataMissingEnvironmentPostProcessor 会检查
    #    spring.config.import，没配就直接抛 "No spring.config.import set" → 服务起不来。
    #    optional: 前缀表示 Nacos 不可达时不阻塞启动（降级用本地配置）。
    import:
      - optional:nacos:${spring.application.name}.yml
  application:
    name: erp-user-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_HOST:mse-d5a70466-nacos-ans.mse.aliyuncs.com}:${NACOS_PORT:8848}
        namespace: erp-dev
        group: DEFAULT_GROUP
      config:
        server-addr: ${NACOS_HOST:mse-d5a70466-nacos-ans.mse.aliyuncs.com}:${NACOS_PORT:8848}
        namespace: erp-dev
        group: DEFAULT_GROUP
        file-extension: yml
        import-check:
          enabled: false
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:localhost:8858}
        port: 8723
      eager: true

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/erp_user?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      database: 2

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: '*'

jwt:
  # 📌 **密钥必须由环境变量注入，不能写死在仓库里**（2026-11-12 修）
  #    🔴 修复前这里是字面量 `cross-border-erp-secret-key-2024` → **任何拿到仓库的人都能签出
  #    管理员 token** → 实测已用该密钥伪造 token 并被**真实的 JwtUtil 校验通过**（userId=1）
  #    → 第 59 道闸门加的 @PreAuthorize 全部形同虚设。
  #    📌 这里**故意不写默认值** —— 写默认值 = 生产环境悄悄用默认值 = 漏洞原样保留；
  #      缺变量就让它**启动失败**，比「带着已知密钥上线」安全得多。
  #    📌 部署侧注入见 k8s/core-services.yaml（secretKeyRef: erp-jwt-secret / jwt-secret）
  #    📌 另有第 60 道闸门 `check-hardcoded-secret.py` 守着这条线。
  secret: ${JWT_SECRET}
  # 📌 **access token 24 小时偏长** —— 一旦泄露，攻击窗口是一整天。
  #    生产建议 2 小时；刷新 token 走 /auth/refresh（30 天）。
  expiration: 7200000