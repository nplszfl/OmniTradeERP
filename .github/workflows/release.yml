name: Automated Release

on:
  push:
    tags:
      - 'v*'

# 📌 **并发组**（2026-11-18）—— 与另两个 workflow 同一个要求。
#    tag 触发时一个 tag 只会对应一个 run，但**同一个 tag 重推**会再起一轮 →
#    没有并发组时两轮并存 → 白白抢 runner。
#    ⚠️ 这里用 `cancel-in-progress: true` → 重推同一个 tag 会取消上一轮（旧 tag 的产物已过时）。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  create-release:
    # 📌 超时保护：GitHub 默认 6 小时 → 卡死时整轮 CI 白占 runner
    #    （2026-11-10 真实卡死 50 分钟的教训）
    timeout-minutes: 30
    name: Create Release
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Extract version
      id: version
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Generate Release Notes
      id: release_notes
      run: |
        echo "release_notes=## 跨境电商ERP系统 ${{ steps.version.outputs.version }}

        ### 更新内容
        - 完善平台API对接
        - 添加单元测试
        - 添加CI/CD自动化

        ### 快速开始
        \`\`\`bash
        cp .env.example .env
        echo "JWT_SECRET=$(openssl rand -base64 32)" >> .env
        docker-compose up -d
        \`\`\`
        > JWT_SECRET 必填（仓库里不留默认值）：不设置 compose 会在启动前直接报错。" >> $GITHUB_OUTPUT

    - name: Create GitHub Release
      uses: actions/create-release@v1
      with:
        tag_name: ${{ github.ref }}
        name: Release ${{ steps.version.outputs.version }}
        body: ${{ steps.release_notes.outputs.release_notes }}
        draft: false
        prerelease: false

    - name: Build and publish
      run: |
        echo "Building release version: ${{ steps.version.outputs.version }}"
        # TODO: 构建并发布到Maven Central
