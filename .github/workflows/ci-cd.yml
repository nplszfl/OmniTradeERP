name: CI/CD Pipeline

on:
  push:
    # ⚠️ 必须是 master —— 本仓库唯一的分支是 master（origin/HEAD -> origin/master）。
    #    之前写的是 [ main, develop ]，而这两个分支**从来不存在** →
    #    三个 workflow 一次都没被触发过 → CI 形同虚设，
    #    所有巡检盲区（端口漂移 / DDL 缺失 / 路由错配）都因此活了下来。
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '18'

jobs:
  # 后端构建和测试
  backend-build-test:
    name: Backend Build & Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        cache: 'maven'

    - name: Build with Maven
      run: mvn clean compile -DskipTests

    - name: Run tests
      run: mvn test

    - name: Package with Maven
      run: mvn clean package -DskipTests

    # 📌 **产物级**可启动性巡检（源码层过了不代表产物能跑）
    #    - check-boot-main-class.py：主类在不在源码里
    #    - check-jar-start-class.py：主类在不在**打出来的 jar** 里
    #      （显式 <mainClass> 时 maven 插件**不校验** → package 照样成功，
    #        产出一个跑起来就 ClassNotFoundException 的 jar）
    - name: 可启动性巡检（主类：源码层 + 产物层）
      run: |
        python3 scripts/check-boot-main-class.py
        python3 scripts/check-jar-start-class.py

    # 📌 种子脚本幂等性巡检
    #    主键冲突 → ERROR 1062 → docker-entrypoint **中止整个 init**
    #    （容器却照样起来 → 后面几个种子文件全没执行 → 静默失败）
    - name: 种子脚本幂等性巡检
      run: python3 scripts/check-seed-idempotency.py

    - name: Upload JAR files
      uses: actions/upload-artifact@v4
      with:
        name: jar-files
        path: '*/target/*.jar'
        retention-days: 7

  # ============================================================
  # 契约巡检：端口 / DDL / API 契约 / 网关路由
  # ============================================================
  # ⚠️ 为什么单独一个 job：这 4 个脚本是**静态**检查，不需要编译整个项目，
  #    单独跑更快（几十秒 vs 几分钟），出问题时定位也更直接。
  #
  # 📌 为什么必须有它们：这几个脚本查出来的都是「编译能过、单测能过、
  #    只有真部署/真起容器才炸」的问题 ——
  #    端口漂移会让 k8s Pod 一直 CrashLoopRestart，
  #    DDL 缺失会让服务连上库就报表不存在，
  #    网关 StripPrefix 配错会让每个请求都 404。
  #    之前它们只在本地手动跑，且 CI 因为分支名写错（main vs master）
  #    一次都没触发过 → 盲区全都活了下来。
  contract-audit:
    name: Contract Audit (端口 / DDL / API / 网关)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 端口一致性（application.yml ↔ compose ↔ k8s ↔ Dockerfile ↔ 文档）
      run: python3 scripts/check-port-consistency.py

    - name: SQL 契约（Java SQL ↔ database/*.sql ↔ datasource 库名）
      run: python3 scripts/check-sql-schema.py --strict

    - name: API 契约（前端 ↔ 网关 ↔ 后端）
      run: python3 scripts/check-api-contract.py --strict

    - name: 响应形状契约（前端解包方式 ↔ 后端返回类型）
      run: python3 scripts/check-response-shape.py --strict

    - name: Feign 契约（Feign 调用 ↔ 目标服务 Controller 映射）
      run: python3 scripts/check-feign-contract.py --strict

    - name: 网关路径改写 ↔ 后端 controller 根路径
      run: python3 scripts/check-gateway-strip.py

    # 📌 以下这几个是**后来补的**巡检，之前只跑前 6 个 ——
    #    「闸门不跑 = 不存在」，它们的盲区就是这么活下来的。
    - name: 主类存在性（源码层：主类在不在、是否唯一）
      run: python3 scripts/check-boot-main-class.py

    - name: 死接口巡检（Controller 里没有对应实现的方法）
      run: python3 scripts/check-dead-endpoints.py

    - name: Long 主键精度（前端不能把 id 当 number 传）
      run: python3 scripts/check-id-precision.py

    - name: Map 注入的 key 不应是用户输入
      run: python3 scripts/check-map-injection-keys.py

    - name: 占位符语法（${} 与 #{} 混用）
      run: python3 scripts/check-placeholder-syntax.py

    - name: 静默失败（catch 空 / 吞异常 / return null）
      run: python3 scripts/check-silent-failures.py

    - name: DDL 挂载（database/*.sql 有没有进 docker-compose 的 init 目录）
      run: python3 scripts/check-db-schema-provision.py

    - name: 种子脚本自洽（表名/列名在 SQL 里真实存在）
      run: python3 scripts/check-seed-table-refs.py

  # ============================================================
  # 结构巡检：需要**真实 MySQL 结构**的两个闸门
  # ============================================================
  # 📌 为什么必须单独一个 job，而且必须**全新初始化**：
  #    check-not-null-defaults / check-not-null-writes 查的是
  #    **线上真实的表结构**（information_schema），
  #    而不是解析 database/*.sql 文件 ——
  #    DDL 文件和线上可能不一致（我一开始就解析 DDL，
  #    结果把 customer-service 的表结构判错了）。
  #
  # 📌 「全新初始化」是关键：
  #    docker-entrypoint 遇到 .sql 里的报错会**中止整个 init**，
  #    但**容器照样起来** → 看起来初始化成功，
  #    实际排在后面的种子文件一个都没跑 → 静默失败。
  #    （实测踩过：zz-seed-data.sql 的 t_role 主键重复
  #      → ERROR 1062 → 后面 3 个种子文件全被跳过。）
  #    scripts/start-audit-mysql.sh 会**扫 init 日志**，
  #    有报错就退出非 0 → 这一层就把静默失败堵住了。
  schema-audit:
    name: Schema Audit (真实表结构 / NOT NULL 写入路径)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 启动全新 MySQL（跑完 database/*.sql 初始化）
      run: bash scripts/start-audit-mysql.sh 3411

    # 📌 **必须带 --strict**：连不上库就直接失败。
    #    不带的话是「跳过 + 绿灯」→ MySQL 没起来也照样显示检查通过
    #    → 盲区就这么溜过去了。
    - name: NOT NULL 无默认值 → 实体↔表结构错位
      run: python3 scripts/check-not-null-defaults.py --strict

    - name: NOT NULL 无默认值 → 写路径从不赋值（插入必失败）
      run: python3 scripts/check-not-null-writes.py --strict

    - name: Dump init 日志（排查用）
      if: always()
      run: docker logs erp-fresh-mysql 2>&1 | tail -60

  # 前端构建和测试
  frontend-build-test:
    name: Frontend Build & Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js ${{ env.NODE_VERSION }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: erp-web/package-lock.json

    - name: Install dependencies
      working-directory: ./erp-web
      run: npm ci

    - name: Lint check
      working: ./erp-web
      run: npm run lint --if-present

    - name: Run tests
      working-directory: ./erp-web
      run: npm run test --if-present

    # ⚠️ vite build **只转译不查类型** —— 之前前端能过 build 但类型一片稀烂，
    #    「后端返回裸 IPage、前端多剥一层 .data」就是这么混进去的
    #    （客户/供应商列表页恒为空）。
    #    现在类型检查是**阻塞项**：新增类型错误直接让 CI 变红。
    - name: Type check (vue-tsc)
      working-directory: ./erp-web
      run: npm run typecheck

    - name: Build
      working-directory: ./erp-web
      run: npm run build

    - name: Upload dist files
      uses: actions/upload-artifact@v4
      with:
        name: dist-files
        path: erp-web/dist
        retention-days: 7

  # Docker镜像构建
  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [backend-build-test, frontend-build-test]
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Gateway image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./docker/Dockerfile.gateway
        push: true
        tags: nplszfl/erp-gateway:latest,nplszfl/erp-gateway:${{ github.sha }}

    - name: Build and push Order Service image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./docker/Dockerfile.order
        push: true
        tags: nplszfl/erp-order-service:latest,nplszfl/erp-order-service:${{ github.sha }}

    - name: Build and push Frontend image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: nplszfl/erp-frontend:latest,nplszfl/erp-frontend:${{ github.sha }}

  # 部署到Kubernetes
  deploy-k8s:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://erp.example.com

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure kubectl
      uses: azure/setup-kubectl@v4
      with:
        version: 'v1.28.0'

    - name: Set up kubeconfig
      run: |
        echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > kubeconfig.yaml
        export KUBECONFIG=kubeconfig.yaml

    - name: Deploy to Kubernetes
      run: |
        # 部署Gateway
        kubectl set image deployment/erp-gateway \
          erp-gateway=nplszfl/erp-gateway:${{ github.sha }} \
          -n erp --context=default

        # 部署Order Service
        kubectl set image deployment/erp-order-service \
          erp-order-service=nplszfl/erp-order-service:${{ github.sha }} \
          -n erp --context=default

        # 部署Frontend
        kubectl set image deployment/erp-frontend \
          erp-frontend=nplszfl/erp-frontend:${{ github.sha }} \
          -n erp --context=default

    - name: Wait for deployment
      run: |
        kubectl rollout status deployment/erp-gateway -n erp --context=default --timeout=5m
        kubectl rollout status deployment/erp-order-service -n erp --context=default --timeout=5m
        kubectl rollout status deployment/erp-frontend -n erp --context=default --timeout=5m

    - name: Verify deployment
      run: |
        kubectl get pods -n erp
        kubectl get svc -n erp

  # 通知部署结果
  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [deploy-k8s]
    if: always()

    steps:
    - name: Send notification
      if: success()
      run: |
        echo "✅ 部署成功！"
        # TODO: 添加飞书/钉钉通知

    - name: Send failure notification
      if: failure()
      run: |
        echo "❌ 部署失败！"
        # TODO: 添加飞书/钉钉通知
