name: CI/CD Pipeline

on:
  push:
    # ⚠️ 必须是 master —— 本仓库唯一的分支是 master（origin/HEAD -> origin/master）。
    #    之前写的是 [ main, develop ]，而这两个分支**从来不存在** →
    #    三个 workflow 一次都没被触发过 → CI 形同虚设，
    #    所有巡检盲区（端口漂移 / DDL 缺失 / 路由错配）都因此活了下来。
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '18'

jobs:
  # 后端构建和测试
  backend-build-test:
    name: Backend Build & Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        cache: 'maven'

    - name: Build with Maven
      run: mvn clean compile -DskipTests

    - name: Run tests
      run: mvn test

    - name: Package with Maven
      run: mvn clean package -DskipTests

    # 📌 **产物级**可启动性巡检（源码层过了不代表产物能跑）
    #    - check-boot-main-class.py：主类在不在源码里
    #    - check-jar-start-class.py：主类在不在**打出来的 jar** 里
    #      （显式 <mainClass> 时 maven 插件**不校验** → package 照样成功，
    #        产出一个跑起来就 ClassNotFoundException 的 jar）
    - name: 可启动性巡检（主类：源码层 + 产物层）
      run: |
        python3 scripts/check-boot-main-class.py
        python3 scripts/check-jar-start-class.py

    # 📌 种子脚本幂等性巡检
    #    主键冲突 → ERROR 1062 → docker-entrypoint **中止整个 init**
    #    （容器却照样起来 → 后面几个种子文件全没执行 → 静默失败）
    - name: 种子脚本幂等性巡检
      run: python3 scripts/check-seed-idempotency.py

    - name: Upload JAR files
      uses: actions/upload-artifact@v4
      with:
        name: jar-files
        path: '*/target/*.jar'
        retention-days: 7

  # ============================================================
  # 契约巡检：端口 / DDL / API 契约 / 网关路由
  # ============================================================
  # ⚠️ 为什么单独一个 job：这 4 个脚本是**静态**检查，不需要编译整个项目，
  #    单独跑更快（几十秒 vs 几分钟），出问题时定位也更直接。
  #
  # 📌 为什么必须有它们：这几个脚本查出来的都是「编译能过、单测能过、
  #    只有真部署/真起容器才炸」的问题 ——
  #    端口漂移会让 k8s Pod 一直 CrashLoopRestart，
  #    DDL 缺失会让服务连上库就报表不存在，
  #    网关 StripPrefix 配错会让每个请求都 404。
  #    之前它们只在本地手动跑，且 CI 因为分支名写错（main vs master）
  #    一次都没触发过 → 盲区全都活了下来。
  contract-audit:
    name: Contract Audit (端口 / DDL / API / 网关)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # 📌 **必须装 PyYAML** —— check-port-consistency.py / check-workflow-validity.py
    #    都要 `import yaml`，而 GitHub 的 ubuntu-latest runner **默认没装**
    #    → ModuleNotFoundError: No module named 'yaml'
    #    → 巡检脚本**第一步就崩** → 整个 job 失败
    #    📌 本项目实测：code-quality.yml 的「契约巡检」步骤就是这么挂的，
    #       而**后面的巡检一个都没跑**（shell -e 遇到第一个失败就停）。
    - name: 安装 Python 依赖
      run: pip install pyyaml

    - name: 端口一致性（application.yml ↔ compose ↔ k8s ↔ Dockerfile ↔ 文档）
      run: python3 scripts/check-port-consistency.py

    # 📌 **环境变量契约**（部署层注入的每个变量 ↔ 应用侧真正读的变量）
    #    📌 为什么必须单独一道闸门：
    #       `check-port-consistency.py` 查端口、`check-k8s-images.py` 查镜像 ——
    #       但**没有任何一道闸门校验「环境变量契约」**，
    #       因为它跨了「部署层（compose/k8s yaml）」和「应用层（application.yml + 框架 jar）」两个域。
    #    📌 实测过的坑（2026-11-04）：
    #       `NACOS_SERVER_ADDR` 部署层到处注入 → 应用读的是 `NACOS_HOST` → 名字对不上 → 注入是摆设
    #       `SENTINEL_DASHBOARD` 注入 → 应用把 dashboard 写死 `localhost:8858` → 连容器自己
    #       → 容器里每个服务都在连**自己**的 localhost
    #    📌 **单测全绿、mvn package 通过、k8s 清单看着都对**，只有真起容器才暴露。
    - name: 环境变量契约（compose/k8s 注入 ↔ 应用读取）
      run: python3 scripts/check-env-contract.py

    # 📌 **部署脚本可执行冒烟测试** ——
    #    📌 为什么必须是「执行」而不是「grep 有没有 set -e」：
    #       `k8s/deploy.sh` 原来的缺陷是**组合**出来的 ——
    #       相对路径 `k8s/*.yaml` + 文档教人 `cd k8s && ./deploy.sh`
    #       → 路径解析成 `k8s/k8s/*.yaml` → 7 条 apply **全部失败**
    #       → 又因为**没有 `set -e`** → 失败被全吞 → 照样打印「✅ 部署完成！」
    #       静态检查（grep set -e）只能抓到一半。
    #    📌 部署路径在 CI 里**零覆盖**（deploy-k8s 的每个 step 都带
    #       `if: configured == 'true'`，本仓库 0 个 secret）→ 必须在这里测。
    - name: 部署脚本可执行冒烟测试（假 kubectl / 假 docker）
      run: python3 scripts/check-deploy-scripts.py

    - name: SQL 契约（Java SQL ↔ database/*.sql ↔ datasource 库名）
      run: python3 scripts/check-sql-schema.py --strict

    - name: API 契约（前端 ↔ 网关 ↔ 后端）
      run: python3 scripts/check-api-contract.py --strict

    - name: 响应形状契约（前端解包方式 ↔ 后端返回类型）
      run: python3 scripts/check-response-shape.py --strict

    # 📌 **响应字段名契约**（视图实读字段 ↔ 后端 DTO 字段）——
    #    📌 **为什么响应形状闸门不够**：
    #       `check-response-shape.py` 查的是「裸数组 还是 Result 包装」，
    #       `check-api-contract.py` 查的是「路径/方法能不能命中」，
    #       `check-dead-endpoints.py` 查的是「Controller 里有没有实现」——
    #       **三道闸门没有一道查字段名**。
    #    📌 本项目实测的漏网之鱼（2026-11-04）：
    #       前端 `request.post<any, { reply: string; ... }>('/ai/assistant/chat')`
    #       后端 `ChatResponse` 里**根本没有 `reply` 字段**（只有 `content`）
    #       → 视图 `messages.value.push({ content: r.reply })`
    #       → **r.reply 恒为 undefined** → **每次聊天气泡都是空的**
    #       而形状 ✅ / 路径 ✅ / 方法 ✅ / 单测全绿 —— **四道闸门全部漏过**。
    #    📌 判据是「**视图实际读了什么**」，不是「前端 interface 声明了什么」：
    #       因为本项目很多视图在**视图层手动映射**字段
    #       （`productName: item.name`），只比 interface 会产生大量假问题。
    #    📌 已用**反向验证**确认它真的会红：
    #       把 `r.content` 改回 `r.reply` → 闸门报错 → 还原 → 变绿。
    - name: 响应字段名契约（视图实读字段 ↔ 后端 DTO）
      run: python3 scripts/check-response-fields.py --strict

    - name: Feign 契约（Feign 调用 ↔ 目标服务 Controller 映射）
      run: python3 scripts/check-feign-contract.py --strict

    - name: 网关路径改写 ↔ 后端 controller 根路径
      run: python3 scripts/check-gateway-strip.py

    # 📌 以下这几个是**后来补的**巡检，之前只跑前 6 个 ——
    #    「闸门不跑 = 不存在」，它们的盲区就是这么活下来的。
    - name: 主类存在性（源码层：主类在不在、是否唯一）
      run: python3 scripts/check-boot-main-class.py

    - name: 死接口巡检（Controller 里没有对应实现的方法）
      run: python3 scripts/check-dead-endpoints.py

    - name: Long 主键精度（前端不能把 id 当 number 传）
      run: python3 scripts/check-id-precision.py

    - name: Map 注入的 key 不应是用户输入
      run: python3 scripts/check-map-injection-keys.py

    - name: 占位符语法（${} 与 #{} 混用）
      run: python3 scripts/check-placeholder-syntax.py

    - name: 静默失败（catch 空 / 吞异常 / return null）
      run: python3 scripts/check-silent-failures.py

    - name: DDL 挂载（database/*.sql 有没有进 docker-compose 的 init 目录）
      run: python3 scripts/check-db-schema-provision.py

    - name: 种子脚本自洽（表名/列名在 SQL 里真实存在）
      run: python3 scripts/check-seed-table-refs.py

    # 📌 **workflow 自身合法性** ——
    #    GitHub 的 workflow 校验在**服务端**做，本地 yaml.safe_load **解析得通**
    #    （PyYAML 不校验 key 合法性）→ 本地全绿、线上**整个文件被拒**
    #    → 0 个 job、0 行日志 → 该 workflow 形同虚设（却显示 failure，不像被跳过）
    #    📌 本项目实测：ci-cd.yml 因为一处 `working:`（应为 `working-directory:`）
    #       从 2026-03-14 起**连续 100 次 run 全部 failure，0 个 job**，
    #       期间所有「CI 巡检全绿」的说法都是**假的** —— 闸门压根没跑过。
    - name: Workflow 文件合法性（GitHub 会直接拒收的写法）
      run: python3 scripts/check-workflow-validity.py

    # 📌 **action 版本必须真实存在** ——
    #    `uses: owner/repo@v0.28.0`（tag 实际叫 `v0.28.0`）在本地 YAML **完全合法**，
    #    只有 GitHub 在运行时拉 action 才会发现拉不到 →
    #    ##[error]Unable to resolve action → 挂在 "Set up job" 阶段
    #    → **整个 job 一个 step 都没跑**
    #    📌 本项目实测：code-quality.yml 的 Security Scan job 连续几个月都是这么挂的。
    - name: Action 版本存在性（联网核对真实 tag/branch）
      # 📌 **必须显式传 GITHUB_TOKEN** ——
      #    匿名请求 GitHub API 只有 **60 次/小时**，而 GitHub Actions runner
      #    的出口 IP 是**大量 workflow 共享**的 → 几乎必然被限流
      #    → API 查不到 → 闸门把每个 action 都判成「不存在」→ **误报**
      #    （实测：CI 上这个闸门把 azure/setup-kubectl 和 trivy-action 全判成不存在，
      #      而它们都在 —— 真去 GitHub 上看是有 tag 的）
      #    → 带 token 是 5000 次/小时，且能查私有仓库。
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        python3 scripts/check-action-versions.py --deep --strict

    # 📌 **下面 3 个闸门必须是独立的 step，不能合进上面那个** ——
    #    合在一起的话，CI 界面上 k8s 闸门失败会挂在「Action 版本存在性」名下，
    #    **报错指向错误的闸门** → 排查时先去看 action 版本，白查半天。
    #    （这跟「闸门少查了东西然后报绿」是同一类问题：报告要和实际做的事对得上。）

    - name: k8s 镜像引用 ↔ 可产出镜像（k8s 清单 ↔ 模块 ↔ Dockerfile）
      run: python3 scripts/check-k8s-images.py

    - name: 部署链一致性（构建矩阵 ↔ 部署计划 ↔ k8s 清单）
      # 📌 这里查的是**构建侧和部署侧会不会漂移**：
      #    构建侧用正则扫 `image:`，部署侧用 YAML 解析只看 Deployment 的 containers
      #    —— **两套不同的解析方法**，结构上就可能不一致
      #    → 「构建了但不部署」/「部署了但没构建」
      # 📌 📌 **为什么必须放在这个 job（而不是 deploy-k8s）**：
      #    deploy-k8s 的每个 step 都带 `if: steps.kube.outputs.configured == 'true'`，
      #    而本仓库**至今 0 个 secret** → KUBE_CONFIG 永远为空 →
      #    → **整个部署路径在 CI 里一次都没跑过** → 零覆盖。
      #    📌 「闸门不跑 = 不存在」→ 校验必须放在**永远会跑的 job** 里。
      run: python3 scripts/check-k8s-deploy-coverage.py

    - name: 网关路由 ↔ 部署编排覆盖度
      # 📌 查的是「网关配了 lb://xxx 的服务，k8s 和 compose 里是不是真的存在」——
      #    2026-11-04 实测：22 个路由目标里有 **10 个从来没被部署过**
      #    → 那些服务的 API 在集群和本地开发环境里**必然 503**
      # 📌 它们都是真模块（目录在、进了 reactor、有主类和 application.yml），
      #    不是死引用 —— 前端还有 7 个对应的 api 客户端。
      run: python3 scripts/check-gateway-deploy-coverage.py

    - name: Dockerfile 与生成脚本一致
      run: python3 scripts/gen-dockerfiles.py --check

  # ============================================================
  # 结构巡检：需要**真实 MySQL 结构**的两个闸门
  # ============================================================
  # 📌 为什么必须单独一个 job，而且必须**全新初始化**：
  #    check-not-null-defaults / check-not-null-writes 查的是
  #    **线上真实的表结构**（information_schema），
  #    而不是解析 database/*.sql 文件 ——
  #    DDL 文件和线上可能不一致（我一开始就解析 DDL，
  #    结果把 customer-service 的表结构判错了）。
  #
  # 📌 「全新初始化」是关键：
  #    docker-entrypoint 遇到 .sql 里的报错会**中止整个 init**，
  #    但**容器照样起来** → 看起来初始化成功，
  #    实际排在后面的种子文件一个都没跑 → 静默失败。
  #    （实测踩过：zz-seed-data.sql 的 t_role 主键重复
  #      → ERROR 1062 → 后面 3 个种子文件全被跳过。）
  #    scripts/start-audit-mysql.sh 会**扫 init 日志**，
  #    有报错就退出非 0 → 这一层就把静默失败堵住了。
  schema-audit:
    name: Schema Audit (真实表结构 / NOT NULL 写入路径)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # 📌 **必须装 PyYAML** —— check-port-consistency.py / check-workflow-validity.py
    #    都要 `import yaml`，而 GitHub 的 ubuntu-latest runner **默认没装**
    #    → ModuleNotFoundError: No module named 'yaml'
    #    → 巡检脚本**第一步就崩** → 整个 job 失败
    #    📌 本项目实测：code-quality.yml 的「契约巡检」步骤就是这么挂的，
    #       而**后面的巡检一个都没跑**（shell -e 遇到第一个失败就停）。
    - name: 安装 Python 依赖
      run: pip install pyyaml

    - name: 启动全新 MySQL（跑完 database/*.sql 初始化）
      run: bash scripts/start-audit-mysql.sh 3411

    # 📌 **必须带 --strict**：连不上库就直接失败。
    #    不带的话是「跳过 + 绿灯」→ MySQL 没起来也照样显示检查通过
    #    → 盲区就这么溜过去了。
    - name: NOT NULL 无默认值 → 实体↔表结构错位
      run: python3 scripts/check-not-null-defaults.py --strict

    - name: NOT NULL 无默认值 → 写路径从不赋值（插入必失败）
      run: python3 scripts/check-not-null-writes.py --strict

    - name: Dump init 日志（排查用）
      if: always()
      run: docker logs erp-fresh-mysql 2>&1 | tail -60

  # 前端构建和测试
  frontend-build-test:
    name: Frontend Build & Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js ${{ env.NODE_VERSION }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: erp-web/package-lock.json

    - name: Install dependencies
      working-directory: ./erp-web
      run: npm ci

    - name: Lint check
      working-directory: ./erp-web
      run: npm run lint --if-present

    - name: Run tests
      working-directory: ./erp-web
      run: npm run test --if-present

    # ⚠️ vite build **只转译不查类型** —— 之前前端能过 build 但类型一片稀烂，
    #    「后端返回裸 IPage、前端多剥一层 .data」就是这么混进去的
    #    （客户/供应商列表页恒为空）。
    #    现在类型检查是**阻塞项**：新增类型错误直接让 CI 变红。
    - name: Type check (vue-tsc)
      working-directory: ./erp-web
      run: npm run typecheck

    - name: Build
      working-directory: ./erp-web
      run: npm run build

    - name: Upload dist files
      uses: actions/upload-artifact@v4
      with:
        name: dist-files
        path: erp-web/dist
        retention-days: 7

  # Docker镜像构建
  # 📌 **矩阵从 k8s 清单反推** —— 不能手写模块清单。
  #    手写 = 多一个会漂移的事实来源：以后往 k8s 加一个服务，
  #    CI 不会自动跟着构建 → 回到「镜像从没构建过 → ImagePullBackOff」的老问题。
  prepare-matrices:
    name: Prepare Build Matrix
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.gen.outputs.matrix }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: "生成镜像构建矩阵（从 k8s/*.yaml 的 image 反推）"
      id: gen
      run: echo "matrix=$(python3 scripts/k8s-image-matrix.py)" >> "$GITHUB_OUTPUT"

  docker-build:
    name: Build ${{ matrix.module }} image
    runs-on: ubuntu-latest
    needs: [backend-build-test, frontend-build-test, prepare-matrices]
    # 📌 必须是 **master** —— 本仓库唯一的分支是 master（origin/HEAD -> origin/master）。
    #    之前写的是 refs/heads/main，而 main 分支**从来不存在**
    #    → 这个 job **永远被跳过** → 镜像从来没构建过 → 部署没发生过。
    if: github.ref == 'refs/heads/master'
    # 📌 **把 secret 转到 env，才能在 step 级 `if` 里判断它存不存在** ——
    #    GitHub 的上下文可用性表里，**`if` 表达式拿不到 `secrets`** ——
    #    无论 job 级还是 step 级，写 `secrets.XXX != ''` 都会让 GitHub **拒收整个文件**：
    #        Unrecognized named-value: 'secrets'.
    #        Located at position 1 within expression: secrets.DOCKER_USERNAME != ''
    #    → 又是「0 个 job、整个 workflow 作废」的老坑（而本地 YAML 解析得通!）。
    #    ✅ `env` 上下文在 step 级 `if` 里**可用**，
    #       而 job 级 `env` 可以引用 `secrets` → 中转一下就绕开了这个限制。
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

    # 📌 **原来只构建 3 个镜像**（gateway / order / frontend），
    #    而 k8s/*.yaml 引用了 **13 个 ERP 镜像** →
    #    另外 10 个镜像**从来没被构建过、从来没被推送过**
    #    → 一旦真的部署 → ImagePullBackOff → Pod 起不来
    #    📌 现在改成 **matrix 覆盖 k8s 里的每一个镜像**
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare-matrices.outputs.images) }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # 📌 **没有凭据时不要硬挂** ——
    #    本仓库目前**一个 secret 都没配**（gh secret list 为空）→
    #    无条件执行 login 会报 "Username and password required" →
    #    整个 job 死在第一个 step → **镜像一个都构建不出来**。
    #    → 改成：有凭据才登录；没有就**只构建不推送**（load 到本地），
    #      这样这个 job 依然能验证「Dockerfile 能不能构建成功」——
    #      📌 这才是这个 job 真正有价值的部分（实测过所有 Dockerfile 都是坏的）。
    - name: Login to Docker Hub
      if: env.DOCKER_USERNAME != ''
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # 📌 统一用**通用的** docker/Dockerfile.service（MODULE/PORT build-arg）——
    #    和 docker-compose.yml 的用法**完全一致** → 编排层只有一套配方。
    - name: Build ${{ matrix.module }} image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./docker/Dockerfile.service
        build-args: |
          MODULE=${{ matrix.module }}
          PORT=${{ matrix.port }}
        # 📌 push 和 load 互斥 —— 按有没有凭据二选一
        push: ${{ env.DOCKER_USERNAME != '' }}
        load: ${{ env.DOCKER_USERNAME == '' }}
        tags: ${{ matrix.image }}:latest,${{ matrix.image }}:${{ github.sha }}

  docker-build-frontend:
    name: Build Frontend image
    runs-on: ubuntu-latest
    needs: [frontend-build-test]
    if: github.ref == 'refs/heads/master'
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      if: env.DOCKER_USERNAME != ''
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Frontend image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: ${{ env.DOCKER_USERNAME != '' }}
        load: ${{ env.DOCKER_USERNAME == '' }}
        tags: nplszfl/erp-frontend:latest,nplszfl/erp-frontend:${{ github.sha }}

  # 部署到Kubernetes
  deploy-k8s:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    # 📌 前端镜像现在由**独立 job** 构建（矩阵 job 只跑 Maven 服务）→ 必须一起等
    needs: [docker-build, docker-build-frontend]
    # 📌 同上 —— 必须是 master
    # 📌 **「有没有 kubeconfig」这个判断必须放在 step 级，不能放 job 级** ——
    #    GitHub 的表达式上下文里，**job 级 `if` 拿不到 `secrets`** →
    #    写成 `if: ... && secrets.KUBE_CONFIG != ''` 会让 GitHub **拒收整个 workflow**：
    #        Unrecognized named-value: 'secrets'.
    #        Located at position 1 within expression: secrets.DOCKER_USERNAME != ''
    #    → 又是「0 个 job、整个文件作废」的老坑。
    #    📌 所以：job 级只看分支，secret 判断下沉到 step 级。
    if: github.ref == 'refs/heads/master'
    environment:
      name: production
      url: https://erp.example.com

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # 📌 没配 KUBE_CONFIG 就**跳过部署**（而不是硬失败）。
    #    本仓库目前**一个 secret 都没配**（`gh secret list` 为空）→
    #    `echo "${{ secrets.KUBE_CONFIG }}" | base64 -d` 会把**空字符串**写进 kubeconfig.yaml
    #    → kubectl 拿一个空配置 → "The connection to the server localhost:8080 was refused"
    #    → 这个 job 必挂。
    #    一旦配好 KUBE_CONFIG，不用改 workflow 就自动恢复部署。
    - name: 检查 KUBE_CONFIG 是否已配置
      id: kube
      run: |
        if [ -n "${{ secrets.KUBE_CONFIG }}" ]; then
          echo "configured=true" >> "$GITHUB_OUTPUT"
        else
          echo "configured=false" >> "$GITHUB_OUTPUT"
          echo "⚠️ 未配置 KUBE_CONFIG secret → 跳过部署（本仓库当前无任何 secret）"
        fi

    # 📌 **必须装 PyYAML** —— scripts/k8s-deploy-plan.py 要 import yaml，
    #    而 GitHub 的 ubuntu-latest runner **默认没装**（本项目实测过）
    - name: Set up Python
      if: steps.kube.outputs.configured == 'true'
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 安装 Python 依赖
      if: steps.kube.outputs.configured == 'true'
      run: pip install pyyaml

    - name: Configure kubectl
      if: steps.kube.outputs.configured == 'true'
      uses: azure/setup-kubectl@v4
      with:
        version: 'v1.28.0'

    - name: Set up kubeconfig
      if: steps.kube.outputs.configured == 'true'
      run: |
        echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > kubeconfig.yaml
        export KUBECONFIG=kubeconfig.yaml

    # 📌 **部署目标必须从 k8s 清单反推**，不能手写。
    #    之前这里手写了 3 条 `kubectl set image`，**三条全是错的**：
    #    1. `erp-frontend` 这个 Deployment 在 k8s 里**根本不存在**
    #       → kubectl 直接报 `deployments.apps "erp-frontend" not found`
    #    2. **container 名写错了** —— Deployment 名 ≠ container 名：
    #          Deployment `erp-gateway` → container `gateway`
    #          Deployment `erp-user-service` → container `user-service`
    #       → `set image deployment/erp-gateway erp-gateway=...` 报 container not found
    #    3. **只覆盖 3 个，k8s 里其实有 13 个 ERP Deployment**
    #       → 另外 10 个永远跑旧镜像
    #    📌 这个 job 一直被「KUBE_CONFIG 未配置」挡着**从没真跑过** → 所以没人发现。
    #    ✅ 现在用 scripts/k8s-deploy-plan.py 从 k8s/*.yaml 生成部署计划，
    #       和构建侧的 k8s-image-matrix.py **同源** → 结构上不会漂移。
    - name: 生成部署计划（从 k8s 清单反推）
      if: steps.kube.outputs.configured == 'true'
      run: |
        python3 scripts/k8s-deploy-plan.py --tsv | tee deploy-plan.tsv
        echo "--- 计划条目数: $(wc -l < deploy-plan.tsv)"

    - name: 应用服务清单（不含 mysql/redis/nacos 等基础设施）
      if: steps.kube.outputs.configured == 'true'
      run: |
        # 📌 先 apply 清单再 set image —— 否则「清单里新加的服务」
        #    在集群里还不存在 → set image 报 not found。
        # 📌 **只 apply 应用清单**，不碰 mysql/redis/nacos：
        #    基础设施由 deploy.sh / 运维单独管，CI 不该碰有状态的东西。
        kubectl apply -f k8s/namespace.yaml --context=default
        for f in k8s/gateway.yaml k8s/core-services.yaml k8s/services.yaml k8s/ai-services.yaml; do
          echo "→ apply $f"
          kubectl apply -f "$f" --context=default
        done

    - name: Deploy to Kubernetes
      if: steps.kube.outputs.configured == 'true'
      env:
        IMAGE_TAG: ${{ github.sha }}
      run: |
        set -euo pipefail
        while IFS=$'\t' read -r deploy container image; do
          [ -z "$deploy" ] && continue
          echo "→ set image deployment/$deploy  $container=$image:$IMAGE_TAG"
          kubectl set image "deployment/$deploy" "$container=$image:$IMAGE_TAG" \
            -n erp --context=default
        done < deploy-plan.tsv

    # 📌 同样从部署计划里读，不再手写清单
    - name: Wait for deployment
      if: steps.kube.outputs.configured == 'true'
      run: |
        set -uo pipefail
        fail=0
        while IFS=$'\t' read -r deploy container image; do
          [ -z "$deploy" ] && continue
          echo "→ rollout status deployment/$deploy"
          if ! kubectl rollout status "deployment/$deploy" -n erp \
               --context=default --timeout=5m; then
            echo "❌ deployment/$deploy 滚动更新失败"
            fail=1
          fi
        done < deploy-plan.tsv
        # 📌 **每个服务都要真的 rollout 成功** —— 不能「失败也当过」
        #    （`set -e` 会被 while 管道里的失败吞掉，所以这里显式收集）
        exit $fail

    - name: Verify deployment
      if: steps.kube.outputs.configured == 'true'
      run: |
        kubectl get pods -n erp
        kubectl get svc -n erp

  # 通知部署结果
  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [deploy-k8s]
    if: always()

    steps:
    - name: Send notification
      if: success()
      run: |
        echo "✅ 部署成功！"
        # TODO: 添加飞书/钉钉通知

    - name: Send failure notification
      if: failure()
      run: |
        echo "❌ 部署失败！"
        # TODO: 添加飞书/钉钉通知
