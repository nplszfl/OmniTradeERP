name: CI/CD Pipeline

on:
  push:
    # ⚠️ 必须是 master —— 本仓库唯一的分支是 master（origin/HEAD -> origin/master）。
    #    之前写的是 [ main, develop ]，而这两个分支**从来不存在** →
    #    三个 workflow 一次都没被触发过 → CI 形同虚设，
    #    所有巡检盲区（端口漂移 / DDL 缺失 / 路由错配）都因此活了下来。
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '18'

jobs:
  # 后端构建和测试
  backend-build-test:
    # 📌 超时保护：GitHub 默认 6 小时 → 卡死时整轮 CI 白占 runner
    #    （2026-11-10 真实卡死 50 分钟的教训）
    timeout-minutes: 60
    name: Backend Build & Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        cache: 'maven'

    - name: Build with Maven
      run: mvn clean compile -DskipTests

    - name: Run tests
      run: mvn test

    - name: Package with Maven
      run: mvn clean package -DskipTests

    # 📌 **产物级**可启动性巡检（源码层过了不代表产物能跑）
    #    - check-boot-main-class.py：主类在不在源码里
    #    - check-jar-start-class.py：主类在不在**打出来的 jar** 里
    #      （显式 <mainClass> 时 maven 插件**不校验** → package 照样成功，
    #        产出一个跑起来就 ClassNotFoundException 的 jar）
    - name: 可启动性巡检（主类：源码层 + 产物层）
      run: |
        python3 scripts/check-boot-main-class.py
        python3 scripts/check-jar-start-class.py

    # 📌 种子脚本幂等性巡检
    #    主键冲突 → ERROR 1062 → docker-entrypoint **中止整个 init**
    #    （容器却照样起来 → 后面几个种子文件全没执行 → 静默失败）
    - name: 种子脚本幂等性巡检
      run: python3 scripts/check-seed-idempotency.py

    - name: Upload JAR files
      uses: actions/upload-artifact@v4
      with:
        name: jar-files
        path: '*/target/*.jar'
        retention-days: 7

  # ============================================================
  # 契约巡检：端口 / DDL / API 契约 / 网关路由
  # ============================================================
  # ⚠️ 为什么单独一个 job：这 4 个脚本是**静态**检查，不需要编译整个项目，
  #    单独跑更快（几十秒 vs 几分钟），出问题时定位也更直接。
  #
  # 📌 为什么必须有它们：这几个脚本查出来的都是「编译能过、单测能过、
  #    只有真部署/真起容器才炸」的问题 ——
  #    端口漂移会让 k8s Pod 一直 CrashLoopRestart，
  #    DDL 缺失会让服务连上库就报表不存在，
  #    网关 StripPrefix 配错会让每个请求都 404。
  #    之前它们只在本地手动跑，且 CI 因为分支名写错（main vs master）
  #    一次都没触发过 → 盲区全都活了下来。
  contract-audit:
    # 📌 超时保护：GitHub 默认 6 小时 → 卡死时整轮 CI 白占 runner
    #    （2026-11-10 真实卡死 50 分钟的教训）
    timeout-minutes: 30
    name: Contract Audit (端口 / DDL / API / 网关)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # 📌 **必须装 PyYAML** —— check-port-consistency.py / check-workflow-validity.py
    #    都要 `import yaml`，而 GitHub 的 ubuntu-latest runner **默认没装**
    #    → ModuleNotFoundError: No module named 'yaml'
    #    → 巡检脚本**第一步就崩** → 整个 job 失败
    #    📌 本项目实测：code-quality.yml 的「契约巡检」步骤就是这么挂的，
    #       而**后面的巡检一个都没跑**（shell -e 遇到第一个失败就停）。
    - name: 安装 Python 依赖
      run: pip install pyyaml

    - name: 端口一致性（application.yml ↔ compose ↔ k8s ↔ Dockerfile ↔ 文档）
      run: python3 scripts/check-port-consistency.py

    # 📌 **环境变量契约**（部署层注入的每个变量 ↔ 应用侧真正读的变量）
    #    📌 为什么必须单独一道闸门：
    #       `check-port-consistency.py` 查端口、`check-k8s-images.py` 查镜像 ——
    #       但**没有任何一道闸门校验「环境变量契约」**，
    #       因为它跨了「部署层（compose/k8s yaml）」和「应用层（application.yml + 框架 jar）」两个域。
    #    📌 实测过的坑（2026-11-04）：
    #       `NACOS_SERVER_ADDR` 部署层到处注入 → 应用读的是 `NACOS_HOST` → 名字对不上 → 注入是摆设
    #       `SENTINEL_DASHBOARD` 注入 → 应用把 dashboard 写死 `localhost:8858` → 连容器自己
    #       → 容器里每个服务都在连**自己**的 localhost
    #    📌 **单测全绿、mvn package 通过、k8s 清单看着都对**，只有真起容器才暴露。
    - name: 环境变量契约（compose/k8s 注入 ↔ 应用读取）
      run: python3 scripts/check-env-contract.py

    # 📌 **部署脚本可执行冒烟测试** ——
    #    📌 为什么必须是「执行」而不是「grep 有没有 set -e」：
    #       `k8s/deploy.sh` 原来的缺陷是**组合**出来的 ——
    #       相对路径 `k8s/*.yaml` + 文档教人 `cd k8s && ./deploy.sh`
    #       → 路径解析成 `k8s/k8s/*.yaml` → 7 条 apply **全部失败**
    #       → 又因为**没有 `set -e`** → 失败被全吞 → 照样打印「✅ 部署完成！」
    #       静态检查（grep set -e）只能抓到一半。
    #    📌 部署路径在 CI 里**零覆盖**（deploy-k8s 的每个 step 都带
    #       `if: configured == 'true'`，本仓库 0 个 secret）→ 必须在这里测。
    - name: 部署脚本可执行冒烟测试（假 kubectl / 假 docker）
      run: python3 scripts/check-deploy-scripts.py

    # 📌 **文档引用巡检**（部署类文档里提到的文件必须真实存在）——
    #    📌 为什么需要：文档里写着一个**不存在的文件**时，
    #       读者照着敲会得到 `no such file or directory`，
    #       而**全绿的 CI 不会告诉他**（文档不在任何闸门的覆盖里）。
    #    📌 实测（2026-11-05）：`docs/Deployment.md` 与 `docs/Quick-Start.md`
    #       都写着 `kubectl apply -f deployment-production.yml`
    #       → **该文件全仓不存在**；`docs/Deployment.md` 里还有一整段
    #       `helm install omnitrade ./charts/omnitrade-erp -f values-production.yaml`
    #       → **仓库里没有 charts/ 目录也没有 values-production.yaml**（整段虚构）。
    #    📌 为什么判据要窄：全仓 .md 泛扫实测 **81 处引用 27 处「不存在」**，
    #       绝大多数是简称 / 省略路径 / 历史报告快照 → **假红机器**，没法用。
    #       所以只查「部署类文档 + 部署类路径家族」。
    - name: 文档引用巡检（部署类文档 ↔ 真实文件）
      run: python3 scripts/check-doc-references.py

    - name: SQL 契约（Java SQL ↔ database/*.sql ↔ datasource 库名）
      run: python3 scripts/check-sql-schema.py --strict

    # 📌 **SQL 方言可移植性**（裸 SQL 里不许出现 H2 不认的 MySQL 方言）——
    #    📌 **为什么需要它**（2026-11-05 实测）：
    #       `erp-analytics-service` 的看板 SQL 用了三种 MySQL 方言
    #       （`DATE_FORMAT` / `INTERVAL 1 DAY` / `DATE_SUB(... WEEKDAY ...)`）
    #       → **H2（即使 MODE=MySQL）不认** → 整条 SQL 抛异常 → 被 `catch` 吞掉 →
    #       → 看板「今日/昨日/本月销售额」「按周营收趋势」**恒为 0 / 恒为空**，
    #         页面上完全看不出来（只有一条 WARN 日志）。
    #    📌 **为什么四道闸门都没发现**：
    #       ① 单测把 Repository **mock 掉了** → SQL 根本没执行；
    #       ② CI **没有 MySQL service** → 也没有真库可跑；
    #       ③ 生产 MySQL 上它是好的 → 语法完全合法；
    #       ④ **没有任何闸门查「这条 SQL 在别的库上能不能跑」**。
    #    📌 判据是**实测**出来的，不是查文档：逐条在 H2（MODE=MySQL）上跑过——
    #       支持的（`IFNULL` / `GROUP_CONCAT` / `TIMESTAMPDIFF` / `CURDATE` / `DATE()` /
    #       `HOUR()` / `ON DUPLICATE KEY UPDATE` …）**一律不报** → 不假红。
    - name: SQL 方言可移植性（MySQL 专有方言 → H2 会抛异常 → 被 catch 吞掉）
      run: python3 scripts/check-sql-portability.py

    # 📌 **「测试与时钟无关」**（第 35 道闸门）——
    #    2026-11-10 00:16 实测：`AnalyticsRepositoryH2Test` 用 `now()` / `now.minusHours(1)`
    #    播种「今天的两单」→ 而 `AnalyticsRepository` 是**按天分桶**的
    #    → 在 **00:00~00:59** 之间跑，`now.minusHours(1)` 落到昨天 → 单测红。
    #    🔴 而它 23:54 提交、CI 也 23:54 跑 → **CI 全绿** → 「绿」只是运气。
    #    判据 = ①「now() 派生值被做了子日位移」+ ②「该模块生产代码按天分桶」→ 才报
    #    （只满足 ① 的是「移动基准」用法，两边一起动 → 永远一致 → 不报）。
    - name: 测试与时钟无关（now() + 子日位移 × 按天分桶 → 时间炸弹测试）
      run: python3 scripts/check-test-clock-independence.py

    # 📌 **「部署通知不许谎报成功」**（第 37 道闸门）——
    #    `deploy-k8s` 没配 KUBE_CONFIG 时会**跳过全部真实部署 step**，
    #    但 job 结论仍是 `success` → 下游若把 `success()` 翻译成「部署成功」，
    #    就是一次货真价实的**假成功**（实测 11-10 的 CI 日志：
    #    19:01:48「跳过部署」→ 19:01:55「✅ 部署成功！」，一个 Deployment 都没 apply）。
    - name: 部署通知诚实性（没部署 ≠ 部署成功）
      run: python3 scripts/check-deploy-notification-honesty.py

    - name: API 契约（前端 ↔ 网关 ↔ 后端）
      run: python3 scripts/check-api-contract.py --strict

    - name: 响应形状契约（前端解包方式 ↔ 后端返回类型）
      run: python3 scripts/check-response-shape.py --strict

    # 📌 **响应字段名契约**（视图实读字段 ↔ 后端 DTO 字段）——
    #    📌 **为什么响应形状闸门不够**：
    #       `check-response-shape.py` 查的是「裸数组 还是 Result 包装」，
    #       `check-api-contract.py` 查的是「路径/方法能不能命中」，
    #       `check-dead-endpoints.py` 查的是「Controller 里有没有实现」——
    #       **三道闸门没有一道查字段名**。
    #    📌 本项目实测的漏网之鱼（2026-11-04）：
    #       前端 `request.post<any, { reply: string; ... }>('/ai/assistant/chat')`
    #       后端 `ChatResponse` 里**根本没有 `reply` 字段**（只有 `content`）
    #       → 视图 `messages.value.push({ content: r.reply })`
    #       → **r.reply 恒为 undefined** → **每次聊天气泡都是空的**
    #       而形状 ✅ / 路径 ✅ / 方法 ✅ / 单测全绿 —— **四道闸门全部漏过**。
    #    📌 判据是「**视图实际读了什么**」，不是「前端 interface 声明了什么」：
    #       因为本项目很多视图在**视图层手动映射**字段
    #       （`productName: item.name`），只比 interface 会产生大量假问题。
    #    📌 已用**反向验证**确认它真的会红：
    #       把 `r.content` 改回 `r.reply` → 闸门报错 → 还原 → 变绿。
    - name: 响应字段名契约（视图实读字段 ↔ 后端 DTO）
      run: python3 scripts/check-response-fields.py --strict

    - name: Feign 契约（Feign 调用 ↔ 目标服务 Controller 映射）
      run: python3 scripts/check-feign-contract.py --strict

    - name: 网关路径改写 ↔ 后端 controller 根路径
      run: python3 scripts/check-gateway-strip.py

    # 📌 **网关路由覆盖率**（前端 api 层 → 网关 → 服务收到路径 → controller 接口）
    #    📌 **为什么 `check-gateway-strip.py` 不够**：
    #       它遍历的是**网关已有的路由**，问「改写对不对」
    #       → 只能发现「路由存在但改写错」
    #       → **发现不了「压根没这条路由」**
    #    📌 而 `check-dead-endpoints.py` 问的是「有没有调用方」
    #       → 一个**有调用方但网关路由缺失**的接口，在它眼里是「活的」→ **漏报**
    #    📌 本脚本补的就是这个**交叉盲区**：三段链路任一段断掉 → 必然 404，
    #       而「前端没接」和「接了但 404」在监控上长得一模一样。
    - name: 网关路由 ↔ 后端 controller 接口 覆盖率
      run: python3 scripts/check-gateway-route-coverage.py

    # 📌 以下这几个是**后来补的**巡检，之前只跑前 6 个 ——
    #    「闸门不跑 = 不存在」，它们的盲区就是这么活下来的。
    - name: 主类存在性（源码层：主类在不在、是否唯一）
      run: python3 scripts/check-boot-main-class.py

    - name: 死接口巡检（Controller 里没有对应实现的方法）
      run: python3 scripts/check-dead-endpoints.py

    - name: Long 主键精度（前端不能把 id 当 number 传）
      run: python3 scripts/check-id-precision.py

    - name: Map 注入的 key 不应是用户输入
      run: python3 scripts/check-map-injection-keys.py

    - name: 占位符语法（${} 与 #{} 混用）
      run: python3 scripts/check-placeholder-syntax.py

    - name: 静默失败（catch 空 / 吞异常 / return null）
      run: python3 scripts/check-silent-failures.py

    # 📌 **指标真实性**（声明了指标 ≠ 指标在说真话）
    #    📌 **2026-11-10 抓到的真缺陷**：
    #       `erp-common` 的 `MetricsConfig` 声明了 5 个 Micrometer 指标
    #       （order.create.count / order.sync.count / order.status /
    #         platform.api.call.count / platform.api.error.count），
    #       通过 `AutoConfiguration.imports` 注册进**所有**带 Actuator 的服务。
    #       但 —— 4 个 Counter **没有任何地方 `.increment()`**、
    #       `order.status` 的 supplier 直接 `return 0;`
    #       → `/actuator/prometheus` 抓到的全是假事实：
    #       「订单创建总数 = 0」而系统明明在创建订单；
    #       「平台 API 失败次数 = 0」而平台同步失败时监控完全看不见。
    #    📌 **根因比疏忽更深**：这些指标声明在 **common** 里 ——
    #       公共库拿不到订单表、也拿不到平台 API → **从设计上就只能写死**。
    #    📌 本闸门查 5 类：无人递增的计数器 / 恒为常量的 Gauge /
    #       公共库声明业务域指标 / 描述与形状不符 / 写入点在永不触发的切面里。
    - name: 指标真实性（假事实指标）
      run: python3 scripts/check-metrics-truthfulness.py

    # 📌 **LLM 降级诚实性** —— 「降级了」必须**看得见**（规则 19）
    #    📌 **为什么需要它**：真实调用失败 → catch → 静默返回 canned 文本，
    #      而 model 仍写 deepseek-chat → **AI 从来没真工作过，界面却完全正常**。
    #      2026-11-04 修过一次，但**没有闸门守着** → 下一个人重构就能悄悄退回去。
    #      查 5 类：DTO 缺 mock/mockReason / 没有 mock 标记常量 /
    #      降级分支没写原因 / 降级分支没改 model / 模拟回复编造 token 用量。
    - name: LLM 降级诚实性（降级不许撒谎）
      run: python3 scripts/check-llm-degradation-honesty.py

    # 📌 **CI 别挂在第三方 npm 镜像上** —— `npm ci` 认 lockfile 的 `resolved` URL，
    #    而 lockfile 里 146 条 resolved 指向国内镜像 → 美区 runner 依赖它 → 一次 502 就红。
    - name: npm registry 依赖（别挂在第三方镜像上）
      run: python3 scripts/check-npm-registry-pinning.py

    # 📌 **MySQL 配置层的硬性必填项**（规则 63 / 64 / 65）
    #    三条都是「**忘了写一个字符**」→ 单测查不出来（不碰 MySQL）、其它闸门也不管。
    - name: MySQL 配置层必填项（字符集 / 注释 / JDBC 公钥）
      run: python3 scripts/check-db-sql-config.py

    # 📌 **内部细节不得泄露给前端**（规则 14）
    #    黑名单（DataAccessException 等）会被「RuntimeException 包装 e.getMessage()」绕过。
    - name: 内部细节泄露（SQL 栈 / 表名 / 列名不得直达前端）
      run: python3 scripts/check-internal-detail-leak.py

    # 📌 **组件扫描不到 = 死代码**（规则 21）—— 静默失效，编译期查不出来
    - name: 组件扫描 / 自动装配（erp-common 的组件必须被注册）
      run: python3 scripts/check-component-scan-deadcode.py

    # 📌 **「选完丢掉」**（规则 86 形态 ②）—— check-fake-success 抓不到这个形态
    - name: 前端选择持久化（选了必须记下来）
      run: python3 scripts/check-selection-persistence.py

    # 📌 **闸门接线**（规则 29）：每个 check-*.py 都必须被 workflow 引用，
    #    否则「写了但没人跑」= 不存在（11-10 第 42 道闸门真实踩过）
    - name: 闸门接线（巡检脚本不许建好了却不跑）
      run: python3 scripts/check-gates-wired.py

    # 📌 **文档端口表**（规则 33）：文档里的端口表不许手抄 —— 漏一个服务就会报红
    - name: 文档端口表（与 application.yml 同源且无遗漏）
      run: python3 scripts/check-doc-port-table.py

    # 📌 **CI 超时保护**（两层）：Dockerfile 构建期保护 + job 级 timeout-minutes
    #    2026-11-10 真实卡死 50 分钟 → 保护当时写在了**没人用的** Dockerfile 里
    - name: CI 超时保护（Dockerfile 构建期 + job 级上限）
      run: python3 scripts/check-ci-timeout-guards.py

    # 📌 **降级事实的落地性**（规则 111）：catch 里「标记 ERROR + 抛异常」
    #    → BizException extends RuntimeException → **事务回滚冲掉标记** → 死循环
    #    2026-11-10 22:50 真实踩过 → 这类缺陷**编译能过、单测测不出**（@DataJpaTest 外层事务遮蔽）
    - name: 降级事实落地性（标记不会被回滚冲掉）
      run: python3 scripts/check-degradation-fact-rollback.py

    # 📌 **文档数字一致性**（规则 51）：手写的数字会静默过期 —— 没人发现
    - name: 文档数字（compose 服务数 ↔ 实际 services 数）
      run: python3 scripts/check-doc-compose-counts.py

    # 📌 **MySQL init 执行顺序** —— 种子必须排在建表之后（规则 61）
    #    📌 **为什么需要它**：docker-entrypoint 按**目标文件名**字母序执行 initdb.d，
    #      每个文件是独立 mysql 会话，**一条语句报错 → 该文件剩余语句全部不执行**，
    #      而容器退出码可能仍是 0 → 后面几百行种子**静默丢失**。
    #      实测：`seed-data.sql` 漏了 `zz-` 前缀 → 排在建表之前 → 用户/角色/权限种子丢失，
    #      且因 initdb.d 只在空数据目录跑一次 → **长期潜伏**，只在全新部署时发作。
    - name: MySQL init 执行顺序（种子必须在建表之后）
      run: python3 scripts/check-init-sql-exec-order.py

    # 📌 **workflow 里引用的脚本必须真实存在，且所在 job 必须有 checkout**（规则 93 的延伸）
    - name: workflow 脚本引用（文件存在 + job 有 checkout）
      run: python3 scripts/check-workflow-script-refs.py

    # 📌 **统计口径一致性**（同一个页面上「说 N 条」和「列出 N 条」必须同一张表）
    #    📌 **为什么需要它**：
    #       2026-11-04 在 AI 客服模块抓到一个真缺陷：
    #         `GET /api/ai/knowledge/stats` 返回的是 `knowledge_document` 表的条数（5），
    #         而**同一个页面**的知识库列表列的是 `knowledge_base` 表（31），
    #         聊天真正检索的也是那 31 条
    #         → 开场白说「基于 5 条行业知识库」、页签却列 31 条 → **界面自相矛盾**。
    #       而单测全绿、接口通着、页面能开 —— **没有一道现有闸门能发现它**。
    #    📌 判据：**前端视图文件**为功能域边界（不是 api 命名空间 ——
    #       一个命名空间常打包多个不相干功能，按它分组会满屏假阳性）；
    #       「条数接口数的那张表」必须在「该页面某个列表接口」里出现。
    #    📌 已用**反向验证**确认它真的会红：
    #       把 `stats()` 改回 `ragService.stats()` → 闸门报错 → 还原 → 变绿。
    - name: 统计口径一致性（条数 ↔ 列表 同一张表）
      run: python3 scripts/check-stat-source-consistency.py --strict

    # 📌 **种子条数声明 ↔ 实际行数**（文档/注释里写的「N 条」必须是真的）
    #    📌 **为什么需要它**：
    #       2026-11-04 修 AI 客服统计口径时顺手发现：
    #       `docs/DEAD-ENDPOINTS.md` 写着「真实只有 **6** 条」，
    #       而 `database/ai-assistant-service.sql` 里 `knowledge_base` 是 **31** 条。
    #       → 规则 51 已经管住了「**接口**是不是死了」，
    #         但「**这张表有几条数据**」这一类**没人管**。
    #    📌 判据：全仓扫「rows: <表名>=<条数>」的**自我声明**，
    #       以及「同一句里既点了表名又给了条数」的隐式声明 → 当场核验 → 不符就红。
    #    📌 真实行数从 `database/*.sql` **算**出来（按自然键去重），
    #       不是抄一份清单（规则 33）。
    - name: 种子条数声明 ↔ 实际行数
      run: python3 scripts/check-seed-row-claims.py

    # 📌 **前端假数据兜底**（接口失败不许拿编的数据冒充真数据）
    #    📌 **为什么需要它**：
    #       2026-11-04 扫 `catch` 块时逮到 3 个真缺陷：
    #       `purchase/index.vue` 接口失败时填 6 条**看起来完全像真的**的采购单
    #       （PO 编号/供应商/金额/日期一应俱全），
    #       `ai/Anomaly.vue` 填 6 条假异常订单 + **写死的 KPI**（total: 1247），
    #       `ai/Recommend.vue` 填 5 条假选品推荐。
    #       → 后端 500 时页面看着有数据，实则全是编的 → 用户分辨不出来
    #       → 可能照着假数据审批/收货/选品 → **真出事**（规则 12 / 19 / 56）。
    #    📌 讽刺的是项目里**早就有正确范式**（tenant/InventoryPredict/Pricing/Dashboard
    #       都改成「失败就如实置空 + 报错」）—— **只是漏了 3 个页面**
    #       → 说明「靠人记得改」这条路走不通 → 必须有闸门。
    - name: 前端假数据兜底（catch 里不许填编出来的数据）
      run: python3 scripts/check-frontend-fake-fallback.py --strict

    # 📌 **假删除**（点了删除不能只改本地数组）
    #    📌 2026-11-04 抓到 2 个真缺陷：
    #       `views/report/index.vue` 和 `views/tenant/index.vue` 的删除按钮
    #       都只做 `list.value = list.value.filter(...)` 然后弹「已删除」
    #       → **后端一个 DELETE 都没发** → 刷新页面东西原样回来
    #       → 用户以为删掉了 → 后续动作（释放库存/停用/通知）全都没发生
    #       → **讽刺**：tenant 后端本来就有 `DELETE /{id}`，前端从来没调过。
    #    📌 注意：这是**成功路径**上的谎言，和「假数据兜底」（失败路径）**形态不同**
    #       → 两道闸门分开查，缺一不可。
    - name: 假删除（点了删除不许只改本地数组）
      run: python3 scripts/check-fake-delete.py --strict

    # 📌 **假成功**（弹了「已xxx」就必须真有后端调用）
    #    📌 2026-11-04 一次扫出 **12 处真缺陷**：
    #       `purchase/index.vue` 的 approve/receive/cancel（后端接口全都有，前端从没调过）、
    #       `ai/Anomaly.vue` 的 confirm/runAll（runAll 连「30 单」都是写死的）、
    #       `ai/Pricing.vue` 的 apply、`ai/Recommend.vue` 的 addToShelf、
    #       `ai/InventoryPredict.vue` 的 createPO/refresh、
    #       `ai/Description.vue` 的 saveToProduct、
    #       `tenant/index.vue` 的 goDashboard/goBilling/goConfig/onPlanSelected。
    #    📌 **讽刺**：这些后端接口**全都存在**，只是前端自己编了个「假成功」。
    #    📌 判据会**追一层本地函数调用**（refresh → load → API），
    #       否则会把正确写法误报成假成功。
    - name: 假成功（弹了「已xxx」就必须真有后端调用）
      run: python3 scripts/check-fake-success.py --strict

    - name: DDL 挂载（database/*.sql 有没有进 docker-compose 的 init 目录）
      run: python3 scripts/check-db-schema-provision.py

    - name: 种子脚本自洽（表名/列名在 SQL 里真实存在）
      run: python3 scripts/check-seed-table-refs.py

    # 📌 **workflow 自身合法性** ——
    #    GitHub 的 workflow 校验在**服务端**做，本地 yaml.safe_load **解析得通**
    #    （PyYAML 不校验 key 合法性）→ 本地全绿、线上**整个文件被拒**
    #    → 0 个 job、0 行日志 → 该 workflow 形同虚设（却显示 failure，不像被跳过）
    #    📌 本项目实测：ci-cd.yml 因为一处 `working:`（应为 `working-directory:`）
    #       从 2026-03-14 起**连续 100 次 run 全部 failure，0 个 job**，
    #       期间所有「CI 巡检全绿」的说法都是**假的** —— 闸门压根没跑过。
    - name: Workflow 文件合法性（GitHub 会直接拒收的写法）
      run: python3 scripts/check-workflow-validity.py

    # 📌 **action 版本必须真实存在** ——
    #    `uses: owner/repo@v0.28.0`（tag 实际叫 `v0.28.0`）在本地 YAML **完全合法**，
    #    只有 GitHub 在运行时拉 action 才会发现拉不到 →
    #    ##[error]Unable to resolve action → 挂在 "Set up job" 阶段
    #    → **整个 job 一个 step 都没跑**
    #    📌 本项目实测：code-quality.yml 的 Security Scan job 连续几个月都是这么挂的。
    - name: Action 版本存在性（联网核对真实 tag/branch）
      # 📌 **必须显式传 GITHUB_TOKEN** ——
      #    匿名请求 GitHub API 只有 **60 次/小时**，而 GitHub Actions runner
      #    的出口 IP 是**大量 workflow 共享**的 → 几乎必然被限流
      #    → API 查不到 → 闸门把每个 action 都判成「不存在」→ **误报**
      #    （实测：CI 上这个闸门把 azure/setup-kubectl 和 trivy-action 全判成不存在，
      #      而它们都在 —— 真去 GitHub 上看是有 tag 的）
      #    → 带 token 是 5000 次/小时，且能查私有仓库。
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        python3 scripts/check-action-versions.py --deep --strict

    # 📌 **下面 3 个闸门必须是独立的 step，不能合进上面那个** ——
    #    合在一起的话，CI 界面上 k8s 闸门失败会挂在「Action 版本存在性」名下，
    #    **报错指向错误的闸门** → 排查时先去看 action 版本，白查半天。
    #    （这跟「闸门少查了东西然后报绿」是同一类问题：报告要和实际做的事对得上。）

    - name: k8s 镜像引用 ↔ 可产出镜像（k8s 清单 ↔ 模块 ↔ Dockerfile）
      run: python3 scripts/check-k8s-images.py

    - name: 部署链一致性（构建矩阵 ↔ 部署计划 ↔ k8s 清单）
      # 📌 这里查的是**构建侧和部署侧会不会漂移**：
      #    构建侧用正则扫 `image:`，部署侧用 YAML 解析只看 Deployment 的 containers
      #    —— **两套不同的解析方法**，结构上就可能不一致
      #    → 「构建了但不部署」/「部署了但没构建」
      # 📌 📌 **为什么必须放在这个 job（而不是 deploy-k8s）**：
      #    deploy-k8s 的每个 step 都带 `if: steps.kube.outputs.configured == 'true'`，
      #    而本仓库**至今 0 个 secret** → KUBE_CONFIG 永远为空 →
      #    → **整个部署路径在 CI 里一次都没跑过** → 零覆盖。
      #    📌 「闸门不跑 = 不存在」→ 校验必须放在**永远会跑的 job** 里。
      run: python3 scripts/check-k8s-deploy-coverage.py

    - name: 网关路由 ↔ 部署编排覆盖度
      # 📌 查的是「网关配了 lb://xxx 的服务，k8s 和 compose 里是不是真的存在」——
      #    2026-11-04 实测：22 个路由目标里有 **10 个从来没被部署过**
      #    → 那些服务的 API 在集群和本地开发环境里**必然 503**
      # 📌 它们都是真模块（目录在、进了 reactor、有主类和 application.yml），
      #    不是死引用 —— 前端还有 7 个对应的 api 客户端。
      run: python3 scripts/check-gateway-deploy-coverage.py

    - name: Dockerfile 与生成脚本一致
      run: python3 scripts/gen-dockerfiles.py --check

  # ============================================================
  # 结构巡检：需要**真实 MySQL 结构**的两个闸门
  # ============================================================
  # 📌 为什么必须单独一个 job，而且必须**全新初始化**：
  #    check-not-null-defaults / check-not-null-writes 查的是
  #    **线上真实的表结构**（information_schema），
  #    而不是解析 database/*.sql 文件 ——
  #    DDL 文件和线上可能不一致（我一开始就解析 DDL，
  #    结果把 customer-service 的表结构判错了）。
  #
  # 📌 「全新初始化」是关键：
  #    docker-entrypoint 遇到 .sql 里的报错会**中止整个 init**，
  #    但**容器照样起来** → 看起来初始化成功，
  #    实际排在后面的种子文件一个都没跑 → 静默失败。
  #    （实测踩过：zz-seed-data.sql 的 t_role 主键重复
  #      → ERROR 1062 → 后面 3 个种子文件全被跳过。）
  #    scripts/start-audit-mysql.sh 会**扫 init 日志**，
  #    有报错就退出非 0 → 这一层就把静默失败堵住了。
  schema-audit:
    # 📌 超时保护：GitHub 默认 6 小时 → 卡死时整轮 CI 白占 runner
    #    （2026-11-10 真实卡死 50 分钟的教训）
    timeout-minutes: 30
    name: Schema Audit (真实表结构 / NOT NULL 写入路径)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # 📌 **必须装 PyYAML** —— check-port-consistency.py / check-workflow-validity.py
    #    都要 `import yaml`，而 GitHub 的 ubuntu-latest runner **默认没装**
    #    → ModuleNotFoundError: No module named 'yaml'
    #    → 巡检脚本**第一步就崩** → 整个 job 失败
    #    📌 本项目实测：code-quality.yml 的「契约巡检」步骤就是这么挂的，
    #       而**后面的巡检一个都没跑**（shell -e 遇到第一个失败就停）。
    - name: 安装 Python 依赖
      run: pip install pyyaml

    - name: 启动全新 MySQL（跑完 database/*.sql 初始化）
      run: bash scripts/start-audit-mysql.sh 3411

    # 📌 **必须带 --strict**：连不上库就直接失败。
    #    不带的话是「跳过 + 绿灯」→ MySQL 没起来也照样显示检查通过
    #    → 盲区就这么溜过去了。
    - name: NOT NULL 无默认值 → 实体↔表结构错位
      run: python3 scripts/check-not-null-defaults.py --strict

    - name: NOT NULL 无默认值 → 写路径从不赋值（插入必失败）
      run: python3 scripts/check-not-null-writes.py --strict

    - name: Dump init 日志（排查用）
      if: always()
      run: docker logs erp-fresh-mysql 2>&1 | tail -60

  # 前端构建和测试
  frontend-build-test:
    # 📌 超时保护：GitHub 默认 6 小时 → 卡死时整轮 CI 白占 runner
    #    （2026-11-10 真实卡死 50 分钟的教训）
    timeout-minutes: 30
    name: Frontend Build & Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js ${{ env.NODE_VERSION }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: erp-web/package-lock.json

    - name: Install dependencies
      working-directory: ./erp-web
      # 📌 **必须强制走官方 registry** —— `npm ci` 认 lockfile 里的 `resolved` URL，
      #    而 `erp-web/package-lock.json` 里 **146 条 resolved 全部指向 `registry.npmmirror.com`**（国内镜像）。
      #    → GitHub runner 在**美区** → CI 依赖一家第三方国内镜像 → 镜像抖一下（实测 502 Bad Gateway）
      #      → `npm ci` 失败 → **CI 红，而代码一个字都没改**。
      #    → `--replace-registry-host=always`（npm ≥ 9.5）把 resolved 的 host 换成下面这个 registry。
      #    ✅ 已核对：146 个包在 npmjs.org 上的 **integrity 与 lockfile 逐一相同** → 换源安全。
      #    📌 **本地开发不受影响**：这条只加在 CI 里，本地 `npm ci` 仍走 npmmirror（国内更快）。
      run: npm ci --registry=https://registry.npmjs.org/ --replace-registry-host=always

    - name: Lint check
      working-directory: ./erp-web
      run: npm run lint --if-present

    - name: Run tests
      working-directory: ./erp-web
      run: npm run test --if-present

    # ⚠️ vite build **只转译不查类型** —— 之前前端能过 build 但类型一片稀烂，
    #    「后端返回裸 IPage、前端多剥一层 .data」就是这么混进去的
    #    （客户/供应商列表页恒为空）。
    #    现在类型检查是**阻塞项**：新增类型错误直接让 CI 变红。
    - name: Type check (vue-tsc)
      working-directory: ./erp-web
      run: npm run typecheck

    - name: Build
      working-directory: ./erp-web
      run: npm run build

    - name: Upload dist files
      uses: actions/upload-artifact@v4
      with:
        name: dist-files
        path: erp-web/dist
        retention-days: 7

  # Docker镜像构建
  # 📌 **矩阵从 k8s 清单反推** —— 不能手写模块清单。
  #    手写 = 多一个会漂移的事实来源：以后往 k8s 加一个服务，
  #    CI 不会自动跟着构建 → 回到「镜像从没构建过 → ImagePullBackOff」的老问题。
  prepare-matrices:
    # 📌 超时保护：GitHub 默认 6 小时 → 卡死时整轮 CI 白占 runner
    #    （2026-11-10 真实卡死 50 分钟的教训）
    timeout-minutes: 10
    name: Prepare Build Matrix
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.gen.outputs.matrix }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: "生成镜像构建矩阵（从 k8s/*.yaml 的 image 反推）"
      id: gen
      run: echo "matrix=$(python3 scripts/k8s-image-matrix.py)" >> "$GITHUB_OUTPUT"

  docker-build:
    # 📌 超时保护：GitHub 默认 6 小时 → 卡死时整轮 CI 白占 runner
    #    （2026-11-10 真实卡死 50 分钟的教训）
    timeout-minutes: 45
    name: Build ${{ matrix.module }} image
    runs-on: ubuntu-latest
    needs: [backend-build-test, frontend-build-test, prepare-matrices]
    # 📌 必须是 **master** —— 本仓库唯一的分支是 master（origin/HEAD -> origin/master）。
    #    之前写的是 refs/heads/main，而 main 分支**从来不存在**
    #    → 这个 job **永远被跳过** → 镜像从来没构建过 → 部署没发生过。
    if: github.ref == 'refs/heads/master'
    # 📌 **把 secret 转到 env，才能在 step 级 `if` 里判断它存不存在** ——
    #    GitHub 的上下文可用性表里，**`if` 表达式拿不到 `secrets`** ——
    #    无论 job 级还是 step 级，写 `secrets.XXX != ''` 都会让 GitHub **拒收整个文件**：
    #        Unrecognized named-value: 'secrets'.
    #        Located at position 1 within expression: secrets.DOCKER_USERNAME != ''
    #    → 又是「0 个 job、整个 workflow 作废」的老坑（而本地 YAML 解析得通!）。
    #    ✅ `env` 上下文在 step 级 `if` 里**可用**，
    #       而 job 级 `env` 可以引用 `secrets` → 中转一下就绕开了这个限制。
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

    # 📌 **原来只构建 3 个镜像**（gateway / order / frontend），
    #    而 k8s/*.yaml 引用了 **13 个 ERP 镜像** →
    #    另外 10 个镜像**从来没被构建过、从来没被推送过**
    #    → 一旦真的部署 → ImagePullBackOff → Pod 起不来
    #    📌 现在改成 **matrix 覆盖 k8s 里的每一个镜像**
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare-matrices.outputs.images) }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # 📌 **没有凭据时不要硬挂** ——
    #    本仓库目前**一个 secret 都没配**（gh secret list 为空）→
    #    无条件执行 login 会报 "Username and password required" →
    #    整个 job 死在第一个 step → **镜像一个都构建不出来**。
    #    → 改成：有凭据才登录；没有就**只构建不推送**（load 到本地），
    #      这样这个 job 依然能验证「Dockerfile 能不能构建成功」——
    #      📌 这才是这个 job 真正有价值的部分（实测过所有 Dockerfile 都是坏的）。
    - name: Login to Docker Hub
      if: env.DOCKER_USERNAME != ''
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # 📌 统一用**通用的** docker/Dockerfile.service（MODULE/PORT build-arg）——
    #    和 docker-compose.yml 的用法**完全一致** → 编排层只有一套配方。
    - name: Build ${{ matrix.module }} image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./docker/Dockerfile.service
        build-args: |
          MODULE=${{ matrix.module }}
          PORT=${{ matrix.port }}
        # 📌 push 和 load 互斥 —— 按有没有凭据二选一
        push: ${{ env.DOCKER_USERNAME != '' }}
        load: ${{ env.DOCKER_USERNAME == '' }}
        tags: ${{ matrix.image }}:latest,${{ matrix.image }}:${{ github.sha }}

  docker-build-frontend:
    # 📌 超时保护：GitHub 默认 6 小时 → 卡死时整轮 CI 白占 runner
    #    （2026-11-10 真实卡死 50 分钟的教训）
    timeout-minutes: 30
    name: Build Frontend image
    runs-on: ubuntu-latest
    needs: [frontend-build-test]
    if: github.ref == 'refs/heads/master'
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      if: env.DOCKER_USERNAME != ''
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Frontend image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: ${{ env.DOCKER_USERNAME != '' }}
        load: ${{ env.DOCKER_USERNAME == '' }}
        tags: nplszfl/erp-frontend:latest,nplszfl/erp-frontend:${{ github.sha }}

  # 部署到Kubernetes
  deploy-k8s:
    # 📌 超时保护：GitHub 默认 6 小时 → 卡死时整轮 CI 白占 runner
    #    （2026-11-10 真实卡死 50 分钟的教训）
    timeout-minutes: 30
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    # 📌 **job 输出：本次到底有没有真部署** ——
    #    job 的结论 `success` 只代表「没报错」，**不代表部署发生了**：
    #    没配 KUBE_CONFIG 时，下面**每一个真实部署 step** 都会被 `if` 跳过 →
    #    job 照样是 `success` → 下游会把它读成「部署成功」。
    #    → 必须把「跳过」这个事实**显式暴露成 output**，让下游能区分
    #      「真部署了」vs「什么都没做」（规则 18：事实标志不能撒谎）。
    outputs:
      deployed: ${{ steps.kube.outputs.configured }}
    # 📌 前端镜像现在由**独立 job** 构建（矩阵 job 只跑 Maven 服务）→ 必须一起等
    needs: [docker-build, docker-build-frontend]
    # 📌 同上 —— 必须是 master
    # 📌 **「有没有 kubeconfig」这个判断必须放在 step 级，不能放 job 级** ——
    #    GitHub 的表达式上下文里，**job 级 `if` 拿不到 `secrets`** →
    #    写成 `if: ... && secrets.KUBE_CONFIG != ''` 会让 GitHub **拒收整个 workflow**：
    #        Unrecognized named-value: 'secrets'.
    #        Located at position 1 within expression: secrets.DOCKER_USERNAME != ''
    #    → 又是「0 个 job、整个文件作废」的老坑。
    #    📌 所以：job 级只看分支，secret 判断下沉到 step 级。
    if: github.ref == 'refs/heads/master'
    environment:
      name: production
      url: https://erp.example.com

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # 📌 没配 KUBE_CONFIG 就**跳过部署**（而不是硬失败）。
    #    本仓库目前**一个 secret 都没配**（`gh secret list` 为空）→
    #    `echo "${{ secrets.KUBE_CONFIG }}" | base64 -d` 会把**空字符串**写进 kubeconfig.yaml
    #    → kubectl 拿一个空配置 → "The connection to the server localhost:8080 was refused"
    #    → 这个 job 必挂。
    #    一旦配好 KUBE_CONFIG，不用改 workflow 就自动恢复部署。
    - name: 检查 KUBE_CONFIG 是否已配置
      id: kube
      run: |
        if [ -n "${{ secrets.KUBE_CONFIG }}" ]; then
          echo "configured=true" >> "$GITHUB_OUTPUT"
        else
          echo "configured=false" >> "$GITHUB_OUTPUT"
          echo "⚠️ 未配置 KUBE_CONFIG secret → 跳过部署（本仓库当前无任何 secret）"
        fi

    # 📌 **必须装 PyYAML** —— scripts/k8s-deploy-plan.py 要 import yaml，
    #    而 GitHub 的 ubuntu-latest runner **默认没装**（本项目实测过）
    - name: Set up Python
      if: steps.kube.outputs.configured == 'true'
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 安装 Python 依赖
      if: steps.kube.outputs.configured == 'true'
      run: pip install pyyaml

    - name: Configure kubectl
      if: steps.kube.outputs.configured == 'true'
      uses: azure/setup-kubectl@v4
      with:
        version: 'v1.28.0'

    - name: Set up kubeconfig
      if: steps.kube.outputs.configured == 'true'
      run: |
        echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > kubeconfig.yaml
        export KUBECONFIG=kubeconfig.yaml

    # 📌 **部署目标必须从 k8s 清单反推**，不能手写。
    #    之前这里手写了 3 条 `kubectl set image`，**三条全是错的**：
    #    1. `erp-frontend` 这个 Deployment 在 k8s 里**根本不存在**
    #       → kubectl 直接报 `deployments.apps "erp-frontend" not found`
    #    2. **container 名写错了** —— Deployment 名 ≠ container 名：
    #          Deployment `erp-gateway` → container `gateway`
    #          Deployment `erp-user-service` → container `user-service`
    #       → `set image deployment/erp-gateway erp-gateway=...` 报 container not found
    #    3. **只覆盖 3 个，k8s 里其实有 13 个 ERP Deployment**
    #       → 另外 10 个永远跑旧镜像
    #    📌 这个 job 一直被「KUBE_CONFIG 未配置」挡着**从没真跑过** → 所以没人发现。
    #    ✅ 现在用 scripts/k8s-deploy-plan.py 从 k8s/*.yaml 生成部署计划，
    #       和构建侧的 k8s-image-matrix.py **同源** → 结构上不会漂移。
    - name: 生成部署计划（从 k8s 清单反推）
      if: steps.kube.outputs.configured == 'true'
      run: |
        python3 scripts/k8s-deploy-plan.py --tsv | tee deploy-plan.tsv
        echo "--- 计划条目数: $(wc -l < deploy-plan.tsv)"

    - name: 应用服务清单（不含 mysql/redis/nacos 等基础设施）
      if: steps.kube.outputs.configured == 'true'
      run: |
        # 📌 先 apply 清单再 set image —— 否则「清单里新加的服务」
        #    在集群里还不存在 → set image 报 not found。
        # 📌 **只 apply 应用清单**，不碰 mysql/redis/nacos：
        #    基础设施由 deploy.sh / 运维单独管，CI 不该碰有状态的东西。
        kubectl apply -f k8s/namespace.yaml --context=default
        for f in k8s/gateway.yaml k8s/core-services.yaml k8s/services.yaml k8s/ai-services.yaml; do
          echo "→ apply $f"
          kubectl apply -f "$f" --context=default
        done

    - name: Deploy to Kubernetes
      if: steps.kube.outputs.configured == 'true'
      env:
        IMAGE_TAG: ${{ github.sha }}
      run: |
        set -euo pipefail
        while IFS=$'\t' read -r deploy container image; do
          [ -z "$deploy" ] && continue
          echo "→ set image deployment/$deploy  $container=$image:$IMAGE_TAG"
          kubectl set image "deployment/$deploy" "$container=$image:$IMAGE_TAG" \
            -n erp --context=default
        done < deploy-plan.tsv

    # 📌 同样从部署计划里读，不再手写清单
    - name: Wait for deployment
      if: steps.kube.outputs.configured == 'true'
      run: |
        set -uo pipefail
        fail=0
        while IFS=$'\t' read -r deploy container image; do
          [ -z "$deploy" ] && continue
          echo "→ rollout status deployment/$deploy"
          if ! kubectl rollout status "deployment/$deploy" -n erp \
               --context=default --timeout=5m; then
            echo "❌ deployment/$deploy 滚动更新失败"
            fail=1
          fi
        done < deploy-plan.tsv
        # 📌 **每个服务都要真的 rollout 成功** —— 不能「失败也当过」
        #    （`set -e` 会被 while 管道里的失败吞掉，所以这里显式收集）
        exit $fail

    - name: Verify deployment
      if: steps.kube.outputs.configured == 'true'
      run: |
        kubectl get pods -n erp
        kubectl get svc -n erp

  # 通知部署结果
  notify:
    # 📌 超时保护：GitHub 默认 6 小时 → 卡死时整轮 CI 白占 runner
    #    （2026-11-10 真实卡死 50 分钟的教训）
    timeout-minutes: 10
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [deploy-k8s]
    if: always()

    steps:
    # 📌 **必须先 checkout** —— 通知脚本在仓库里（`scripts/notify-deploy-status.py`），
    #    **不 checkout 就没有这个文件** → `python3: can't open file ... No such file or directory`
    #    → 退出码 2 → **整个 job 失败** → CI/CD 变红。
    #    📌 实测（11-10 15:15）：这一条是我加通知时漏的 → CI 从绿变红，
    #    而报错信息看起来像「脚本坏了」，极具误导性。
    - name: Checkout code
      uses: actions/checkout@v4

    # 📌 **不能把 job 的 `success()` 直接翻译成「部署成功」** ——
    #    `deploy-k8s` 在**没配 KUBE_CONFIG** 时会**跳过所有真实部署 step**
    #    （含 `Verify deployment`），但 job 结论仍然是 `success`
    #    → 曾经在这里打印过「✅ 部署成功！」，而实际上**一个 Deployment 都没 apply**
    #    （实测 11-10 的 CI 日志：19:01:48「跳过部署」→ 19:01:55「✅ 部署成功！」）。
    #    → 必须看 `needs.deploy-k8s.outputs.deployed`
    #      （规则 18：事实标志不能撒谎；规则 19：降级必须带原因且能被调用方看见）。
    # 📌 **通知要真的发出去** —— 只 `echo` 到日志的话，
    #    **只有主动打开 GitHub 网页的人看得到**（规则 101 的续集）。
    #    webhook URL **只从 secret 读**，仓库里不出现任何 URL。
    - name: Send notification (已部署)
      if: needs.deploy-k8s.outputs.deployed == 'true' && success()
      # 📌 **通知失败不许把 CI 拖红**（硬规则 2）：通知只是「锦上添花」，
      #    部署本身可能已经成功 → 不能因为发不出去就让整个 workflow 失败。
      continue-on-error: true
      env:
        FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        echo "✅ 部署成功！"
        python3 scripts/notify-deploy-status.py --status deployed \
          --commit "${{ github.sha }}" --run-url "$RUN_URL"

    - name: Send notification (未部署 —— 跳过，不谎报成功)
      if: needs.deploy-k8s.outputs.deployed != 'true' && success()
      # 📌 同上：通知失败不许拖红 CI
      continue-on-error: true
      env:
        FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        echo "⏭️ **本次未部署**：KUBE_CONFIG secret 未配置 → 部署步骤全部跳过。"
        echo "   （这不是「部署成功」—— 集群里一个 Deployment 都没变。）"
        python3 scripts/notify-deploy-status.py --status not-deployed \
          --commit "${{ github.sha }}" --run-url "$RUN_URL" \
          --message "KUBE_CONFIG secret 未配置 → 部署步骤全部跳过"

    # 📌 **失败分支更要发通知** —— 通知最该起作用的时刻就是「CI 挂了」
    - name: Send failure notification
      if: failure()
      # 📌 同上
      continue-on-error: true
      env:
        FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        echo "❌ 部署失败！"
        python3 scripts/notify-deploy-status.py --status failed \
          --commit "${{ github.sha }}" --run-url "$RUN_URL" \
          --message "CI/部署流程失败，详见链接"
