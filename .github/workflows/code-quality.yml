name: Code Quality Check

on:
  push:
    # ⚠️ 必须是 master —— 本仓库唯一的分支是 master（origin/HEAD -> origin/master）。
    #    之前写的是 [ main, develop ]，而这两个分支**从来不存在** →
    #    三个 workflow 一次都没被触发过 → CI 形同虚设，
    #    所有巡检盲区（端口漂移 / DDL 缺失 / 路由错配）都因此活了下来。
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

jobs:
  # Java代码检查
  java-code-quality:
    # 📌 超时保护：GitHub 默认 6 小时 → 卡死时整轮 CI 白占 runner
    #    （2026-11-10 真实卡死 50 分钟的教训）
    timeout-minutes: 30
    name: Java Code Quality
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # 📌 **必须装 PyYAML** —— check-port-consistency.py / check-workflow-validity.py
    #    都要 `import yaml`，而 GitHub 的 ubuntu-latest runner **默认没装**
    #    → ModuleNotFoundError: No module named 'yaml'
    #    → 巡检脚本**第一步就崩** → 整个 job 失败
    #    📌 本项目实测：code-quality.yml 的「契约巡检」步骤就是这么挂的，
    #       而**后面的巡检一个都没跑**（shell -e 遇到第一个失败就停）。
    - name: 安装 Python 依赖
      run: pip install pyyaml

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    # ⚠️ 之前这三个步骤是**假的**：pom 里没有配置 checkstyle / spotbugs / sonar 插件，
    #    也没有对应的配置文件 → `mvn checkstyle:check` 直接报
    #    "Plugin not found in any plugin repository" → 步骤必然失败。
    #    而因为 workflow 的触发分支写的是 [ main, develop ]（本仓库只有 master），
    #    这个 workflow **一次都没跑过**，所以没人发现它是坏的。
    #
    # 📌 现状：真正的质量门禁是下面的「契约巡检」job（4 个静态巡检脚本），
    #    它查的是「编译能过、单测能过，只有真部署才炸」的那类问题。
    #    等以后真要引入 Checkstyle/SpotBugs，再在 pom 里配好插件 + 规则文件后启用。

    - name: 契约巡检（端口 / DDL / API / 网关）
      run: |
        python3 scripts/check-port-consistency.py
        python3 scripts/check-sql-schema.py --strict
        # 📌 SQL 方言可移植性：H2 不认的 MySQL 方言 → 整条 SQL 抛异常 → 被 catch 吞掉
        #    → 看板数字恒为 0 而页面看不出来（单测 mock 掉了 Repository，测不到）
        python3 scripts/check-sql-portability.py
        # 📌 **「测试与时钟无关」**（第 35 道闸门）——
        #    `now()` 派生的数据做**子日位移**（minusHours/plusMinutes…），
        #    而该模块生产代码**按天分桶** → 在 00:00~00:59 之间跑会跨到昨天 → 单测红。
        #    实测 2026-11-10 00:16 抓到 `AnalyticsRepositoryH2Test` 这么一颗雷：
        #    它 23:54 提交、CI 也 23:54 跑 → **CI 全绿** → 绿得靠运气。
        python3 scripts/check-test-clock-independence.py
        # 📌 **「部署通知不许谎报成功」**（第 37 道闸门）——
        #    没配 KUBE_CONFIG → 部署步骤全跳过 → job 仍是 success →
        #    通知 job 若照着 `success()` 打印「部署成功」＝**假成功**。
        python3 scripts/check-deploy-notification-honesty.py
        python3 scripts/check-api-contract.py --strict
        python3 scripts/check-response-shape.py --strict
        # 📌 **响应字段名契约**（视图实读字段 ↔ 后端 DTO）——
        #    形状/路径/方法三道闸门**都不查字段名** →
        #    `r.reply`（后端只有 `content`）这类缺陷能一路穿过所有闸门，
        #    表现为「聊天气泡永远是空的」。
        #    判据是「视图实际读了什么」而非「前端 interface 声明了什么」——
        #    因为视图层存在显式字段映射，只比 interface 会全是假问题。
        python3 scripts/check-response-fields.py --strict
        python3 scripts/check-feign-contract.py --strict
        python3 scripts/check-gateway-strip.py
        # 📌 网关路由覆盖率（前端 → 网关 → 服务收到路径 → controller 接口）
        #    补 `check-gateway-strip.py` 的盲区：**压根没这条路由**它发现不了。
        python3 scripts/check-gateway-route-coverage.py

    # 📌 后续补的巡检也要进来 —— **闸门不跑 = 不存在**，
    #    之前只跑前 6 个，后 10 个的盲区就是这么活下来的。
    - name: 结构/可启动性巡检
      # 📌 **必须显式传 GITHUB_TOKEN** ——
      #    匿名请求 GitHub API 只有 **60 次/小时**，而 GitHub Actions runner
      #    的出口 IP 是**大量 workflow 共享**的 → 几乎必然被限流
      #    → API 查不到 → 闸门把每个 action 都判成「不存在」→ **误报**
      #    → 带 token 是 5000 次/小时，且能查私有仓库。
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        python3 scripts/check-boot-main-class.py
        python3 scripts/check-dead-endpoints.py
        python3 scripts/check-id-precision.py
        python3 scripts/check-map-injection-keys.py
        python3 scripts/check-placeholder-syntax.py
        python3 scripts/check-silent-failures.py
        # 📌 **指标真实性** —— 声明了指标 ≠ 指标在说真话
        #    （2026-11-10：erp-common 的 5 个 Micrometer 指标全是假的 —— 无人递增 / 硬编码 0）
        python3 scripts/check-metrics-truthfulness.py
        # 📌 **LLM 降级诚实性** —— 降级必须看得见（规则 19 / 56）
        #    降级时 model 仍写真实模型名 = 假事实；模拟回复编造 token 用量 = 假事实
        python3 scripts/check-llm-degradation-honesty.py
        # 📌 **敏感参数不许走 URL 查询串**（残余风险 6 的回归保护）
        #    query string 会进 nginx / ingress / 网关访问日志（$request = 完整请求行）→ 明文口令进日志
        python3 scripts/check-secret-in-url-params.py
        # 📌 **自称 AI/ML 必须名副其实**（规则 18 / 56）
        #    「Prophet + ARIMA」「AI智能定价算法」这类对外字段 = 谎报事实
        #    → 真值来源 = 该模块 pom 是否真有 ML / LLM 依赖
        python3 scripts/check-ai-claim-honesty.py
        # 📌 **「记了账、没改东西」**（规则 72 / 80 / 82）
        #    写商品维度的变更历史、却不更新商品主表 → 假成功（采纳了但价格没变）
        python3 scripts/check-history-without-master-update.py
        # 📌 **「写多张表却没有事务」**（规则 111 / 129）
        #    中途失败 → 部分落库 → 数据不一致 + 假成功
        python3 scripts/check-multi-write-without-tx.py
        # 📌 **账户系统鉴权**（2026-11-12 · Critical 漏洞的守门人）
        #    `anyRequest().permitAll()` → 整个账户系统不用带 token
        #    → 配合「调用方指定 defaultPassword」→ **未认证即可接管任意账号**
        #    → ① 不许 permitAll ② 敏感写操作必须 @PreAuthorize
        #    ③ @PreAuthorize 里的角色码必须**存在于种子数据**（否则管理员被锁在门外）
        python3 scripts/check-account-authz.py
        # 📌 **硬编码凭证**（规则 140）
        #    JWT 签名密钥 / 第三方平台密钥写在仓库里 → 拿到仓库的人就能冒充身份
        #    （实测已用仓库里的 jwt.secret 伪造出管理员 token 并被真实 JwtUtil 校验通过）
        python3 scripts/check-hardcoded-secret.py
        # 📌 **安全文档的声明 ↔ 仓库现实**（规则 51 / 93：手写结论会静默过期）
        #    docs/SECURITY.md 第六节「残余风险」是一份**手写的风险登记表**
        #    → 有人把 admin123 修掉了、文档还写着 → **文档开始骗人**
        #    ✅ 判据：文档声称存在的风险，**必须真的还存在**；且文档点名的那处
        #    必须和第 60 道闸门的豁免名单**对得上**（否则文档和闸门各说各话）
        python3 scripts/check-security-doc-claims.py
        # 📌 **前端「假成功 / 假删除」**（规则 80 / 82）
        #    声称做了写操作（添加/保存/删除…成功），所在函数里却没有一个请求 → 弹了提示但啥也没发生
        python3 scripts/check-frontend-fake-success.py
        # 📌 **提交信息里不能出现工作流命令字面量**（规则 138）
        #    提交信息原文会被 docker buildx 的 provenance JSON 带进 CI 日志
        #    → 其中一行以工作流 error 命令开头 → GitHub 把它当成真错误
        #    → **全绿的 CI 在页面上显示一片红**，工具也会误报「有错误」
        python3 scripts/check-commit-message-workflow-commands.py
        # 📌 **CI 别挂在第三方 npm 镜像上**（lockfile 的 146 条 resolved 指向国内镜像）
        python3 scripts/check-npm-registry-pinning.py
        # 📌 **MySQL 配置层必填项** —— 字符集 / 注释空格 / JDBC 公钥（规则 63 / 64 / 65）
        python3 scripts/check-db-sql-config.py
        # 📌 **内部细节不得泄露给前端**（规则 14）
        python3 scripts/check-internal-detail-leak.py
        # 📌 **组件扫描不到 = 死代码**（规则 21）
        python3 scripts/check-component-scan-deadcode.py
        # 📌 **「选完丢掉」**（规则 86 形态 ②）
        python3 scripts/check-selection-persistence.py
        # 📌 **闸门接线**（规则 29）
        python3 scripts/check-gates-wired.py
        # 📌 **文档端口表**（规则 33）
        python3 scripts/check-doc-port-table.py
        # 📌 **CI 超时保护**（两层）
        python3 scripts/check-ci-timeout-guards.py
        # 📌 **降级事实的落地性**（规则 111）
        python3 scripts/check-degradation-fact-rollback.py
        # 📌 **业务错误的状态码**（规则 28 / 44 / 107）
        python3 scripts/check-business-error-status.py
        # 📌 **文档数字一致性**（规则 51）
        python3 scripts/check-doc-compose-counts.py
        # 📌 **MySQL init 执行顺序** —— 种子必须排在建表之后（规则 61）
        python3 scripts/check-init-sql-exec-order.py
        # 📌 **workflow 脚本引用**（文件存在 + job 有 checkout）
        python3 scripts/check-workflow-script-refs.py
        python3 scripts/check-db-schema-provision.py
        python3 scripts/check-seed-table-refs.py
        python3 scripts/check-seed-idempotency.py
        python3 scripts/check-workflow-validity.py
        # 📌 **闸门失败能不能真的拖红 job** —— 规则 29 / 88 / 99
        #    （`|| true` 吞退出码 / 管道掩盖 / job 级 continue-on-error / shell 关 errexit）
        python3 scripts/check-gate-failure-propagation.py
        # 📌 **前端绕过 api/ 层的直接网络调用必须自带 `/api` 前缀**（少写一个就是 404）
        python3 scripts/check-frontend-direct-http.py
        python3 scripts/check-action-versions.py --deep --strict

    # 📌 **k8s / Dockerfile 三个闸门单独一个 step** ——
    #    合进上面的话，CI 界面上失败会挂在「结构/可启动性巡检」名下，
    #    **报错指向错误的闸门** → 排查时先去看 boot-main-class，白查半天。

    - name: 部署链一致性巡检
      run: |
        python3 scripts/check-k8s-images.py
        python3 scripts/check-k8s-deploy-coverage.py
        # 📌 网关路由 ↔ 部署编排：lb://xxx 的服务必须在 k8s 和 compose 里真的存在
        python3 scripts/check-gateway-deploy-coverage.py
        python3 scripts/gen-dockerfiles.py --check

  # 前端代码检查
  frontend-code-quality:
    # 📌 超时保护：GitHub 默认 6 小时 → 卡死时整轮 CI 白占 runner
    #    （2026-11-10 真实卡死 50 分钟的教训）
    timeout-minutes: 20
    name: Frontend Code Quality
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js 18
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install dependencies
      working-directory: ./erp-web
      # 📌 **必须强制走官方 registry** —— `npm ci` 认 lockfile 里的 `resolved` URL，
      #    而 `erp-web/package-lock.json` 里 **146 条 resolved 全部指向 `registry.npmmirror.com`**（国内镜像）。
      #    → GitHub runner 在**美区** → CI 依赖一家第三方国内镜像 → 镜像抖一下（实测 502 Bad Gateway）
      #      → `npm ci` 失败 → **CI 红，而代码一个字都没改**。
      #    → `--replace-registry-host=always`（npm ≥ 9.5）把 resolved 的 host 换成下面这个 registry。
      #    ✅ 已核对：146 个包在 npmjs.org 上的 **integrity 与 lockfile 逐一相同** → 换源安全。
      #    📌 **本地开发不受影响**：这条只加在 CI 里，本地 `npm ci` 仍走 npmmirror（国内更快）。
      run: npm ci --registry=https://registry.npmjs.org/ --replace-registry-host=always

    - name: Run ESLint
      working-directory: ./erp-web
      run: npm run lint --if-present

    - name: Run Prettier check
      working-directory: ./erp-web
      run: npm run format:check --if-present

    # ⚠️ 之前是 `npx tsc --noEmit`，但 erp-web 当时**没有 tsconfig.json**：
    #    tsc 找不到编译目标，打印帮助后 exit 1 → 这一步必然失败。
    #    而且项目是 Vue，普通 tsc 读不了 .vue 单文件组件，必须用 vue-tsc。
    #
    # 📌 这道闸门是**棘轮式收紧**的：
    #    - 引入时基线是 61 个类型错误（根因是 src/api/*.ts 的返回类型没体现后端
    #      的 Result 包装，加上 19 个视图文件的类型标注问题）→ 一度 continue-on-error
    #    - 2026-11-03 已把基线清零（vue-tsc --noEmit 0 错误）→ **去掉 continue-on-error**，
    #      从现在起类型错误会**直接阻塞 CI**。
    #
    #    清零过程中顺带修掉的真 bug（都是 vite build 发现不了的，因为 vite 只转译不查类型）：
    #    - 视图层对「裸 IPage」接口多剥一层 .data → 客户/供应商列表页恒为空
    #    - `ElMessage.loading` 在 element-plus 里根本不存在 → 平台配置页
    #      「测试连接 / 同步商品」按钮一点就 TypeError
    #    - src/api/*.ts 大量 request.get 没写返回类型 → 类型系统完全失效
    - name: Run TypeScript type check (vue-tsc)
      working-directory: ./erp-web
      run: npm run typecheck

  # 安全扫描
  security-scan:
    # 📌 超时保护：GitHub 默认 6 小时 → 卡死时整轮 CI 白占 runner
    #    （2026-11-10 真实卡死 50 分钟的教训）
    timeout-minutes: 20
    name: Security Scan
    runs-on: ubuntu-latest
    # 📌 **必须显式声明 security-events: write** ——
    #    上传 SARIF 到 GitHub Security 需要这个权限，
    #    而 workflow 默认的 GITHUB_TOKEN 只有 read
    #    → ##[error]Resource not accessible by integration
    #    → 扫描结果**跑完了却传不上去** → 安全告警形同虚设
    permissions:
      contents: read
      security-events: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # 📌 **必须先预热 Maven 本地仓库** ——
    #    trivy 扫 pom.xml 时会去 Maven Central 拉 BOM/父 pom 来确定依赖版本，
    #    而 GitHub runner 的出口 IP 常年被限流：
    #        FATAL Error  remote Maven repository returned 429 Too Many Requests
    #                 for https://repo.maven.apache.org/maven2/...
    #                 Retry-After: 1800
    #        The repository blocks all subsequent requests from this IP until the block clears.
    #    → **整个 Security Scan job 挂掉**（本项目实测，连续多次 run 都是这么挂的）
    #    📌 解法：先 `mvn dependency:go-offline` 把依赖拉进 ~/.m2，
    #       再用 actions/cache 缓存起来 —— trivy 就能离线解析版本，不碰 Maven Central。
    - name: 预热 Maven 本地仓库（避免 Trivy 拉 BOM 时被 429）
      run: mvn -B -q dependency:go-offline -DexcludeArtifactIds=erp-common || mvn -B -q dependency:resolve || true

    - name: 缓存 Maven 仓库
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-m2-

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        # 📌 固定版本号，别用 @master —— master 会漂移，
        #    哪天上游改了行为，CI 突然红/绿都不是自己的锅。
        # 📌 **版本不能随便挑** —— 实测踩坑：
        #    v0.28.0 看着正常，但它内部引 `setup-trivy@v0.2.1`，
        #    而上游把那个 tag **删了** → 顶层 action 存在，**一跑就炸**，
        #    报错还报的是**内层** action 的名字 → 排查时极容易看错地方。
        #    → v0.36.0 内部按 **SHA** 固定 setup-trivy（不可变，不会被删）。
        #    → 这就是 scripts/check-action-versions.py --deep 存在的意义。
        # 📌 exit-code: '0' —— SARIF 会照常上传给 GitHub Security，
        #    真正的门禁交给「安全」页面的告警，而不是让整个 CI 挂掉。
        exit-code: '0'
        ignore-unfixed: true
        vuln-type: 'os,library'

    - name: Upload Trivy results to GitHub Security
      # 📌 必须是 **v4** —— v1/v2 已被 GitHub 废弃（2025-01-10 起）：
      #    ##[error]CodeQL Action major versions v1 and v2 have been deprecated.
      #    → 整个 step 直接死 → job 挂 → 安全扫描**永远传不上去**
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: 'trivy-results.sarif'
