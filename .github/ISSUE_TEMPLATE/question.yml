name: Question / Support
description: Ask how to use or configure something
labels: ["question"]
body:
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Which module, what you're trying to do, what you've already tried.
    validations:
      required: false
