server:
  port: 8086

spring:
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_HOST:127.0.0.1}:${NACOS_PORT:8848}
        namespace: ${NACOS_NAMESPACE:erp-dev}
        group: DEFAULT_GROUP
      config:
        server-addr: ${NACOS_HOST:127.0.0.1}:${NACOS_PORT:8848}
        namespace: ${NACOS_NAMESPACE:erp-dev}
        group: DEFAULT_GROUP
        file-extension: yml
        refresh-enabled: true
  application:
    name: erp-inventory-alert-service
  
  # 数据库配置
  # 📌 项目权威数据库是 MySQL（docker-compose 只有 mysql:8.0）。
  #    之前这里指向 jdbc:postgresql://localhost:5432/omnitrade_erp，
  #    而仓库里既没有 Postgres 实例，也没有任何 PostgreSQL 版 DDL → 连不上库。
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/erp_inventory_alert?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}

  # ⚠️ 必须显式开 sql.init：
  # Spring Boot 默认 spring.sql.init.mode=embedded，**只对 H2/HSQL 等内存库生效**，
  # 对 MySQL/PostgreSQL 不会执行 classpath 下的 schema.sql。
  # 本模块用的是 MyBatis-Plus（@TableName），没有 @Entity，
  # 所以 ddl-auto 那句是空转 —— 5 张表只能靠 schema.sql 建。
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      continue-on-error: true
  
  # JPA配置
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  
  # 邮件配置
  mail:
    host: smtp.example.com
    port: 587
    username: noreply@example.com
    password: password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# 库存预警扫描（定时任务）
# 📌 预警引擎必须有一个「自动触发源」。以前只有 POST /inventory/alert/check
#    这个手动接口（还要调用方自带 currentStock），全仓无调用方 → 预警永不产生。
#    现在由 AlertScanScheduler 定时扫活表 erp_inventory.erp_inventory。
erp:
  alert:
    scan:
      enabled: ${ERP_ALERT_SCAN_ENABLED:true}
      interval-ms: ${ERP_ALERT_SCAN_INTERVAL_MS:300000}

# MyBatis-Plus配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.crossborder.erp.inventory.alert.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_id

# 日志配置
logging:
  level:
    com.crossborder.erp.inventory.alert: DEBUG
    org.springframework: INFO