server:
  port: 8086

spring:
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_HOST:127.0.0.1}:${NACOS_PORT:8848}
        namespace: ${NACOS_NAMESPACE:erp-dev}
        group: DEFAULT_GROUP
      config:
        server-addr: ${NACOS_HOST:127.0.0.1}:${NACOS_PORT:8848}
        namespace: ${NACOS_NAMESPACE:erp-dev}
        group: DEFAULT_GROUP
        file-extension: yml
        refresh-enabled: true
  application:
    name: erp-inventory-alert-service
  
  # 数据库配置
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:omnitrade_erp}
    username: postgres
    password: postgres

  # ⚠️ 必须显式开 sql.init：
  # Spring Boot 默认 spring.sql.init.mode=embedded，**只对 H2/HSQL 等内存库生效**，
  # 对 PostgreSQL 不会执行 classpath 下的 schema.sql。
  # 本模块用的是 MyBatis-Plus（@TableName），没有 @Entity，
  # 所以 ddl-auto 那句是空转 —— 5 张表只能靠 schema.sql 建。
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      continue-on-error: true
  
  # JPA配置
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  # 邮件配置
  mail:
    host: smtp.example.com
    port: 587
    username: noreply@example.com
    password: password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# MyBatis-Plus配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.crossborder.erp.inventory.alert.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_id

# 日志配置
logging:
  level:
    com.crossborder.erp.inventory.alert: DEBUG
    org.springframework: INFO