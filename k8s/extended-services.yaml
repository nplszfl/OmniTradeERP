---
# 📌 **网关路由到的、但此前一直没被部署的服务**（2026-11-04 补齐）
#
# 🔴 背景：网关 `erp-gateway/src/main/resources/application.yml` 里配了 22 个 `lb://xxx-service`，
#    而 k8s 清单里只有 13 个 Deployment —— **下面这 10 个服务的 API 在集群上必然 503**
#    （网关要解析一个 Service，而 k8s 里连 Service 对象都没有）。
#
# 📌 它们**都是真模块**：目录在、进了 maven reactor、有 @SpringBootApplication 主类、
#    有独立的 application.yml（各自的端口/库名）和 database/*.sql 建表脚本。
#    不是死引用 —— 前端 erp-web/src/api/ 里就有 customer / analytics / inventory-alert /
#    purchase / social / supplier / tenant 七个 api 客户端。
#
# 📌 端口是**从各模块自己的 application.yml 的 server.port 读出来**的，
#    不是手抄的 —— 唯一事实来源永远是应用侧配置。

---
# 数据分析服务
apiVersion: apps/v1
kind: Deployment
metadata:
  name: erp-analytics-service
  namespace: erp
  labels:
    app: erp-analytics-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: erp-analytics-service
  template:
    metadata:
      labels:
        app: erp-analytics-service
    spec:
      containers:
      - name: analytics-service
        image: nplszfl/erp-analytics-service:latest
        ports:
        - containerPort: 8097
          name: http
        env:
        - name: NACOS_HOST
          value: "nacos-service"
        - name: NACOS_PORT
          value: "8848"
        - name: SENTINEL_DASHBOARD
          value: "sentinel-service:8858"
        - name: MYSQL_HOST
          value: "mysql-service"
        - name: REDIS_HOST
          value: "redis-service"
        - name: RABBITMQ_HOST
          value: "rabbitmq-service"
        - name: TZ
          value: "Asia/Shanghai"
        - name: JAVA_OPTS
          value: "-Xms512m -Xmx1024m -XX:+UseG1GC"
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8097
          initialDelaySeconds: 60
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8097
          initialDelaySeconds: 30
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: erp-analytics-service
  namespace: erp
  labels:
    app: erp-analytics-service
spec:
  ports:
  - port: 8097
    targetPort: 8097
    name: http
  selector:
    app: erp-analytics-service

