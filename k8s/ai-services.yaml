---
# 智能定价服务
apiVersion: apps/v1
kind: Deployment
metadata:
  name: erp-pricing-service
  namespace: erp
  labels:
    app: erp-pricing-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: erp-pricing-service
  template:
    metadata:
      labels:
        app: erp-pricing-service
    spec:
      containers:
      - name: pricing-service
        image: nplszfl/erp-pricing-service:latest
        ports:
        - containerPort: 8087
          name: http
        env:
        - name: NACOS_HOST
          value: "nacos-service"
        - name: NACOS_PORT
          value: "8848"
        - name: SENTINEL_DASHBOARD
          value: "sentinel-service:8858"
        - name: MYSQL_HOST
          value: "mysql-service"
        - name: REDIS_HOST
          value: "redis-service"
        - name: RABBITMQ_HOST
          value: "rabbitmq-service"
        - name: TZ
          value: "Asia/Shanghai"
        - name: JAVA_OPTS
          value: "-Xms512m -Xmx1024m -XX:+UseG1GC"
        # 📌 **AI 能力（可选，默认关闭）** —— 建议原因由 LLM 生成；密钥走 Secret（清单里不留明文）
        #    📌 下面这些默认值**必须与应用 application.yml 里的默认值逐字一致**
        #       —— 由 scripts/check-llm-compose-defaults.py 盯着
        - name: LLM_API_KEY
          valueFrom:
            secretKeyRef:
              name: erp-llm-secret
              key: llm-api-key
              optional: true
        - name: LLM_API_VERSION
          value: ""
        - name: LLM_BASE_URL
          value: "https://api.deepseek.com"
        - name: LLM_DEPLOYMENT
          value: ""
        - name: LLM_ENABLED
          value: "false"
        - name: LLM_MAX_TOKENS
          value: "2000"
        - name: LLM_MODEL
          value: "deepseek-chat"
        - name: LLM_PROVIDER
          value: "deepseek"
        - name: LLM_TEMPERATURE
          value: "0.7"
        - name: LLM_TIMEOUT
          value: "30000"
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8087
          initialDelaySeconds: 60
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8087
          initialDelaySeconds: 30
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: erp-pricing-service
  namespace: erp
  labels:
    app: erp-pricing-service
spec:
  ports:
  - port: 8087
    targetPort: 8087
    name: http
  selector:
    app: erp-pricing-service

