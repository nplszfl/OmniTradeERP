apiVersion: apps/v1
kind: Deployment
metadata:
  name: erp-gateway
  namespace: erp
  labels:
    app: erp-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: erp-gateway
  template:
    metadata:
      labels:
        app: erp-gateway
    spec:
      containers:
      - name: gateway
        image: nplszfl/erp-gateway:latest
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: NACOS_HOST
          value: "nacos-service"
        - name: NACOS_PORT
          value: "8848"
        - name: SENTINEL_DASHBOARD
          value: "sentinel-service:8858"
        - name: TZ
          value: "Asia/Shanghai"
        - name: JAVA_OPTS
          value: "-Xms512m -Xmx1024m -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: erp-gateway-service
  namespace: erp
  labels:
    app: erp-gateway
spec:
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  selector:
    app: erp-gateway
  type: LoadBalancer
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: erp-ingress
  namespace: erp
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  # 📌 **host 是部署期注入的**，不是写死的域名。
  #
  # ⚠️ **为什么不能写死**（2026-11-13 实测的真实缺陷）：
  #    这里原来写的是 `host: erp.example.com` —— RFC 2606 **保留域名**，
  #    **永远不可能解析到我们的服务**；
  #    而且 `k8s/deploy.sh` 是 `kubectl apply -f k8s/*.yaml` **直接应用**的，
  #    没有任何模板替换 → **这个保留域名会被硬编码进集群**
  #    → 真实域名（比如 `erp.acme.com`）的请求**匹配不到这条 Ingress 规则**
  #    → **全站 404**（而且 kubectl 不会报错，部署照样打印「✅ 部署完成！」）。
  #
  # ✅ 现在：写**占位符** `__INGRESS_HOST__`，
  #    由 `k8s/deploy.sh` 用 python 渲染后 apply（见该脚本的「渲染 Ingress 域名」步骤）。
  #    📌 占位符本身**不能是合法域名** —— 否则「忘了注入」会变成「静默用错域名」。
  #    → 这里用 `__INGRESS_HOST__`（下划线形式，域名语法上非法）。
  - host: __INGRESS_HOST__
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: erp-gateway-service
            port:
              number: 8080
