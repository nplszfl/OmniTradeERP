---
# 🔴 **JWT 签名密钥（2026-11-12 17:30 再修一处）**
#
#    📌 **这个文件里现在【没有】Secret 定义了** —— 这是**故意的**。
#    📌 之前这里放着一个占位符：
#        stringData:
#          jwt-secret: "PLACEHOLDER_SET_BY_deploy_sh"
#        而 `k8s/deploy.sh` 的执行顺序是：
#            ① kubectl create secret generic erp-jwt-secret --from-literal=jwt-secret=$RANDOM
#            ② for f in k8s/*.yaml; do kubectl apply -f "$f"; done   ← **这一步会把 ① 覆盖掉**
#        `kubectl apply` 是三方合并：last-applied（原=随机值）≠ 新清单（=占位符）
#        → **占位符胜出** → 集群里最终的密钥 = **仓库里公开的那个字符串**
#        → 任何拿到仓库的人都能伪造管理员 token → **未认证即可接管账号**（规则 140，Critical）。
#
#    ✅ **现在清单里不放任何密钥** → 清单 apply 覆盖不了 deploy.sh 生成的随机值。
#    ✅ 真实值只由 `k8s/deploy.sh` 现场随机生成（`openssl rand`）。
#    ✅ **fail-closed**：直接 `kubectl apply -f k8s/` 而没先建 Secret 时 →
#       Pod 卡在 `CreateContainerConfigError` → ** loudly 失败**，
#       而不是「带着仓库里公开的密钥启动」。
#       建法：`kubectl -n erp create secret generic erp-jwt-secret --from-literal=jwt-secret='<随机 32+ 字节>'`
#    📌 第 64 道闸门 `check-jwt-secret-runtime.py` 专管这类（清单里不许有值 + 顺序 + 应用侧无默认值）。
---
# 用户服务
apiVersion: apps/v1
kind: Deployment
metadata:
  name: erp-user-service
  namespace: erp
  labels:
    app: erp-user-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: erp-user-service
  template:
    metadata:
      labels:
        app: erp-user-service
    spec:
      containers:
      - name: user-service
        image: nplszfl/erp-user-service:latest
        ports:
        - containerPort: 8084
          name: http
        env:
        # 📌 **JWT 签名密钥从 Secret 注入**（不再用仓库里的字面量）
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: erp-jwt-secret
              key: jwt-secret
        - name: NACOS_HOST
          value: "nacos-service"
        - name: NACOS_PORT
          value: "8848"
        - name: SENTINEL_DASHBOARD
          value: "sentinel-service:8858"
        - name: MYSQL_HOST
          value: "mysql-service"
        - name: REDIS_HOST
          value: "redis-service"
        - name: RABBITMQ_HOST
          value: "rabbitmq-service"
        - name: TZ
          value: "Asia/Shanghai"
        - name: JAVA_OPTS
          value: "-Xms512m -Xmx1024m -XX:+UseG1GC"
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8084
          initialDelaySeconds: 60
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8084
          initialDelaySeconds: 30
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: erp-user-service
  namespace: erp
  labels:
    app: erp-user-service
spec:
  ports:
  - port: 8084
    targetPort: 8084
    name: http
  selector:
    app: erp-user-service

