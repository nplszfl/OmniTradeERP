---
# 🔴 **JWT 签名密钥**（2026-11-12 新增）
#    📌 之前 erp-user-service 的 `jwt.secret` 是**仓库里的字面量** → 任何人可签出管理员 token
#    （实测已用该密钥伪造 token 并被真实 JwtUtil 校验通过）→ 鉴权形同虚设。
#    📌 现在应用侧写成 `${JWT_SECRET}`（**故意不写默认值** → 缺变量就启动失败，
#      而不是「带着已知密钥上线」）。
#    ✅ **这个文件里故意不提供可用密钥**（只有占位符）——
#      否则「apply 一下就用上了仓库里的已知密钥」= 漏洞原样保留。
#    ✅ 正确做法（生产）：
#        kubectl -n erp create secret generic erp-jwt-secret \
#          --from-literal=jwt-secret='<随机 32+ 字节>'
#        （`k8s/deploy.sh` 已经会自动做这件事：环境变量有就用，没有就随机生成）
#    📌 换密钥 = 所有人重新登录（旧 token 全部失效），这是预期行为。
apiVersion: v1
kind: Secret
metadata:
  name: erp-jwt-secret
  namespace: erp
type: Opaque
stringData:
  # 📌 **占位符，不是可用密钥** —— deploy.sh 会用真实随机值覆盖它。
  #    直接 apply 这个文件而不跑 deploy.sh → 应用会带着这个占位符启动 →
  #    第 60 道闸门 `check-hardcoded-secret.py` 会报错（它认识这个占位符）。
  jwt-secret: "PLACEHOLDER_SET_BY_deploy_sh"
---
# 用户服务
apiVersion: apps/v1
kind: Deployment
metadata:
  name: erp-user-service
  namespace: erp
  labels:
    app: erp-user-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: erp-user-service
  template:
    metadata:
      labels:
        app: erp-user-service
    spec:
      containers:
      - name: user-service
        image: nplszfl/erp-user-service:latest
        ports:
        - containerPort: 8084
          name: http
        env:
        # 📌 **JWT 签名密钥从 Secret 注入**（不再用仓库里的字面量）
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: erp-jwt-secret
              key: jwt-secret
        - name: NACOS_HOST
          value: "nacos-service"
        - name: NACOS_PORT
          value: "8848"
        - name: SENTINEL_DASHBOARD
          value: "sentinel-service:8858"
        - name: MYSQL_HOST
          value: "mysql-service"
        - name: REDIS_HOST
          value: "redis-service"
        - name: RABBITMQ_HOST
          value: "rabbitmq-service"
        - name: TZ
          value: "Asia/Shanghai"
        - name: JAVA_OPTS
          value: "-Xms512m -Xmx1024m -XX:+UseG1GC"
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8084
          initialDelaySeconds: 60
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8084
          initialDelaySeconds: 30
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: erp-user-service
  namespace: erp
  labels:
    app: erp-user-service
spec:
  ports:
  - port: 8084
    targetPort: 8084
    name: http
  selector:
    app: erp-user-service

