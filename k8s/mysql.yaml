apiVersion: v1
kind: Namespace
metadata:
  name: erp
  labels:
    name: erp
    app: cross-border-erp
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nacos-config
  namespace: erp
data:
  MODE: "standalone"
  MYSQL_SERVICE_HOST: "mysql-service"
  MYSQL_SERVICE_PORT: "3306"
  MYSQL_SERVICE_DB_NAME: "nacos"
  MYSQL_SERVICE_USER: "root"
  MYSQL_SERVICE_PASSWORD: "root"
---
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: erp
type: Opaque
stringData:
  root-password: "root"
---
apiVersion: app/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: erp
  labels:
    app: mysql
spec:
  serviceName: mysql-service
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - name: mysql
        image: mysql:8.0
        # 📌 **max_connections 必须显式调高**（2026-11-14 实测推导）。
        # MySQL 8.0 默认 max_connections=151，而本集群的连接需求 =
        #   22 个服务模块 × Hikari maximum-pool-size（合计 280，单副本）× replicas:2 ≈ **560 条**
        # → 超出默认上限 3.7 倍 → 启动期必然 `Too many connections`（探针环境 22 服务并发启动时已实测复现）。
        # 留出运维/迁移/监控的余量，取 1000。
        # 📌 改这个值要同步重算 `scripts/check-db-connection-budget.py` 的期望预算（闸门会核）。
        args:
        - "--max-connections=1000"
        ports:
        - containerPort: 3306
          name: mysql
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: root-password
        - name: TZ
          value: "Asia/Shanghai"
        volumeMounts:
        - name: mysql-data
          mountPath: /var/lib/mysql
        - name: init-script
          mountPath: /docker-entrypoint-initdb.d
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          exec:
            command:
            - mysqladmin
            - ping
            - -h
            - localhost
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - mysqladmin
            - ping
            - -h
            - localhost
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
      - name: mysql-data
        persistentVolumeClaim:
          claimName: mysql-pvc
      - name: init-script
        configMap:
          name: mysql-init-script
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-service
  namespace: erp
  labels:
    app: mysql
spec:
  ports:
  - port: 3306
    targetPort: 3306
    name: mysql
  selector:
    app: mysql
  clusterIP: None
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
  namespace: erp
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
