      dockerfile: docker/Dockerfile.service
      args:
        MODULE: erp-inventory-prediction-service
        PORT: "8088"
    container_name: erp-inventory-prediction-service
    ports:
      - "8088:8088"
    environment:
      NACOS_SERVER_ADDR: nacos:8848
      SENTINEL_DASHBOARD: sentinel:8858
      MYSQL_HOST: mysql
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      TZ: Asia/Shanghai
    depends_on:
      mysql:
