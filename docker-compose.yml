version: '3.8'

services:
  # MySQL数据库
  mysql:
    image: mysql:8.0
    container_name: erp-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: erp
      TZ: Asia/Shanghai
      # 官方 mysql:8.0 镜像默认 LANG 为空（POSIX locale），
      # mysql 客户端会退化成 latin1 连接，把 init 脚本里的 UTF-8 中文双重编码成乱码。
      # 这里设成 C.UTF-8 兜底；真正的修复是每个 .sql 文件开头的 SET NAMES utf8mb4
      # （因为每个 init 文件由独立的 mysql 会话执行，容器级 locale 只是双保险）。
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./database/customer-service.sql:/docker-entrypoint-initdb.d/customer-service.sql:ro
      - ./database/supplier-service.sql:/docker-entrypoint-initdb.d/supplier-service.sql:ro
      - ./database/ai-assistant-service.sql:/docker-entrypoint-initdb.d/ai-assistant-service.sql:ro
      - ./database/anomaly-detection-service.sql:/docker-entrypoint-initdb.d/anomaly-detection-service.sql:ro
      - ./database/finance-service.sql:/docker-entrypoint-initdb.d/finance-service.sql:ro
      - ./database/inventory-prediction-service.sql:/docker-entrypoint-initdb.d/inventory-prediction-service.sql:ro
      - ./database/inventory-service.sql:/docker-entrypoint-initdb.d/inventory-service.sql:ro
      - ./database/inventory-alert-service.sql:/docker-entrypoint-initdb.d/inventory-alert-service.sql:ro
      - ./database/logistics-service.sql:/docker-entrypoint-initdb.d/logistics-service.sql:ro
      - ./database/pricing-service.sql:/docker-entrypoint-initdb.d/pricing-service.sql:ro
      - ./database/product-description-service.sql:/docker-entrypoint-initdb.d/product-description-service.sql:ro
      - ./database/product-recommendation-service.sql:/docker-entrypoint-initdb.d/product-recommendation-service.sql:ro
      - ./database/purchase-service.sql:/docker-entrypoint-initdb.d/purchase-service.sql:ro
      - ./database/reporting-service.sql:/docker-entrypoint-initdb.d/reporting-service.sql:ro
      # ⚠️ 这个漏挂过一次：erp_social 库从来没被创建，
      #    而 erp-social-commerce-service 用 JPA ddl-auto:update —— Hibernate 只建表不建库，
      #    → 社交电商服务在 compose 环境启动即报 "Unknown database 'erp_social'"。
      #    scripts/check-db-schema-provision.py 会守住这条。
      - ./database/social-commerce-service.sql:/docker-entrypoint-initdb.d/social-commerce-service.sql:ro
      - ./database/tenant-service.sql:/docker-entrypoint-initdb.d/tenant-service.sql:ro
      - ./database/seed-data.sql:/docker-entrypoint-initdb.d/seed-data.sql:ro
      - ./database/user-service.sql:/docker-entrypoint-initdb.d/user-service.sql:ro
      - ./database/warehouse-service.sql:/docker-entrypoint-initdb.d/warehouse-service.sql:ro
      # ⚠️ zz- 前缀是必须的：docker-entrypoint-initdb.d 按**文件名字母序**执行，
      #    而各 *-service.sql 里有 DROP TABLE IF EXISTS。
      #    这个文件种的是「活表」数据（erp_inventory / wms_warehouse / fin_record /
      #    t_permission），必须排在所有 service.sql 之后，否则种子数据会被后面
      #    的 DROP TABLE 洗掉（历史上 t_permission/t_role_permission 就这样被清零过）。
      - ./database/seed-live-data.sql:/docker-entrypoint-initdb.d/zz-seed-live-data.sql:ro
      # ⚠️ 租户种子单独一个文件（而不是并进 seed-live-data.sql）：
      #    docker-entrypoint-initdb.d 里每个 .sql 是**一个独立的 mysql 会话**，
      #    一条语句报错 → 从出错行起该文件剩余语句全部不执行，退出码可能仍是 0。
      #    拆开 = 故障隔离。zz- 前缀保证排在 tenant-service.sql 建表之后。
      - ./database/seed-tenant.sql:/docker-entrypoint-initdb.d/zz-seed-tenant.sql:ro
      # ⚠️ 仓库 WMS 作业流种子（入库/出库/调拨/波次拣货/盘点/批次/包装物料）
      #    这 11 张活表此前**从来没有种子数据** → 七个页面全是空白。
      #    同样用 zz- 前缀 + 独立文件（故障隔离 + 排在 warehouse-service.sql 建表之后）。
      - ./database/seed-warehouse.sql:/docker-entrypoint-initdb.d/zz-seed-warehouse.sql:ro
    networks:
      - erp-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: erp-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - erp-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: erp-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_DEFAULT_VHOST: /erp
      TZ: Asia/Shanghai
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - erp-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Nacos
  nacos:
    image: nacos/nacos-server:v2.4.0
    container_name: erp-nacos
    environment:
      MODE: standalone
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: mysql
      MYSQL_SERVICE_DB_NAME: nacos
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_USER: root
      MYSQL_SERVICE_PASSWORD: root
      PREFER_HOST_MODE: hostname
      JVM_XMS: 512m
      JVM_XMX: 512m
      TZ: Asia/Shanghai
    ports:
      - "8848:8848"
      - "9848:9848"
    volumes:
      - nacos-data:/home/nacos/data
      - nacos-logs:/home/nacos/logs
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - erp-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Sentinel
  sentinel:
    image: bladex/sentinel-dashboard:1.8.7
    container_name: erp-sentinel
    ports:
      - "8858:8858"
      - "8719:8719"
    networks:
      - erp-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8858/#/login"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Gateway
  gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        MODULE: erp-gateway
        PORT: "8080"
    container_name: erp-gateway
    ports:
      - "8080:8080"
    environment:
      NACOS_HOST: nacos
      NACOS_PORT: 8848
      SENTINEL_DASHBOARD: sentinel:8858
      TZ: Asia/Shanghai
    depends_on:
      nacos:
        condition: service_healthy
      sentinel:
        condition: service_healthy
    networks:
      - erp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

