server:
  port: 8089

spring:
  application:
    name: erp-ai-assistant-service
  config:
    # ⚠️ 必须有这行：classpath 上有 nacos-config starter 时，Spring Cloud 会强制检查
    #    spring.config.import，没配直接抛 "No spring.config.import set" → 服务起不来。
    import:
      - optional:nacos:${spring.application.name}.yml
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_HOST:mse-d5a70466-nacos-ans.mse.aliyuncs.com}:${NACOS_PORT:8848}
  # ⚠️ 必须显式配 datasource：
  # 本模块用 JPA（@Entity KnowledgeDocument + JpaRepository），
  # 统一继承根 pom 后 erp-common 的 DataSource 自动配置被激活，
  # 但 application.yml 里没有 url → 启动期直接失败：
  #   "Failed to configure a DataSource: 'url' attribute is not specified"
  # 即「服务根本起不来」。
  # 变量名必须和 compose 注入的一致（MYSQL_HOST / MYSQL_PORT），
  # 写死 localhost 会导致容器里连不上库（这个坑踩过）。
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/erp_ai_assistant_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
  jpa:
    hibernate:
      # 用 update 让 Hibernate 兜底补齐字段（DDL 漏字段也能自愈）；
      # 纯 validate 会在表结构对不上时启动失败。
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      database: 2
      timeout: 3000

# Swagger配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# LLM API配置（统一配置，支持DeepSeek/OpenAI/Azure）
llm:
  # 是否启用真实API调用（配置API Key后设为true）
  enabled: ${LLM_ENABLED:false}
  # API Key（支持环境变量：LLM_API_KEY / DEEPSEEK_API_KEY / OPENAI_API_KEY）
  api-key: ${LLM_API_KEY:${DEEPSEEK_API_KEY:${OPENAI_API_KEY:}}}
  # API Base URL
  # 📌 **API 根地址**（唯一事实来源 = LLMEndpointResolver）
  #    📌 **带不带 /v1 都行**，解析器会归一化 → 不会拼出双 /v1
  #    📌 ⚠️ 这里写的是**不带 /v1** —— 和 LLMConfig 的类默认值保持一致。
  #       两处默认值不一致 = 其中一处是死代码（而 application.yml 永远生效）。
  #    📌 ⚠️ 端点拼接只能走 LLMEndpointResolver，不要在代码里自己拼路径。
  base-url: ${LLM_BASE_URL:https://api.deepseek.com}
  # 模型名称
  model: ${LLM_MODEL:deepseek-chat}
  # 请求超时（毫秒）
  timeout: ${LLM_TIMEOUT:30000}
  # 最大Token数
  max-tokens: ${LLM_MAX_TOKENS:2000}
  # Temperature
  temperature: ${LLM_TEMPERATURE:0.7}
  # Provider: deepseek, openai, azure
  provider: ${LLM_PROVIDER:deepseek}
  # Azure 专用（provider=azure 时必填）
  # 📌 Azure 的 URL 形状和其他家不同：/openai/deployments/{deployment}/chat/completions?api-version=
  deployment: ${LLM_DEPLOYMENT:}
  api-version: ${LLM_API_VERSION:}

# RAG配置
rag:
  enabled: true
  vector-db:
    type: redis  # redis, milvus, pinecone
    dimension: 1536
  retrieval:
    top-k: 3
    similarity-threshold: 0.7

# 知识库配置
knowledge:
  refresh-interval: 3600  # 秒
  default-language: zh
  categories:
    - 订单
    - 物流
    - 产品
    - 售后
    - 价格
    - 库存

# 应用配置
app:
  name: AI智能客服服务
  version: 1.5.0
  author: 火球鼠
