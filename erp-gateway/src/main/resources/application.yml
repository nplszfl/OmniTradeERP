server:
  port: 8080

spring:
  config:
    # ⚠️ 必须有这行：classpath 上有 spring-cloud-starter-alibaba-nacos-config 时，
    #    Spring Cloud 的 ConfigDataMissingEnvironmentPostProcessor 会检查
    #    spring.config.import，没配就直接抛 "No spring.config.import set" → 服务起不来。
    #    optional: 前缀表示 Nacos 不可达时不阻塞启动（降级用本地配置）。
    import:
      - optional:nacos:${spring.application.name}.yml
  application:
    name: erp-gateway
  main:
    web-application-type: reactive
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_HOST:mse-d5a70466-nacos-ans.mse.aliyuncs.com}:${NACOS_PORT:-8848}
        namespace: erp-dev
        group: DEFAULT_GROUP
      config:
        server-addr: ${NACOS_HOST:mse-d5a70466-nacos-ans.mse.aliyuncs.com}:${NACOS_PORT:-8848}
        namespace: erp-dev
        group: DEFAULT_GROUP
        file-extension: yml
        import-check:
          enabled: false
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: auth-service
          uri: lb://erp-user-service
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1
        # 用户/角色/权限/部门管理（erp-user-service）
        # ⚠️ 这四条路由之前完全不存在 → 前端 erp-web/src/api/user.ts 的 20 处调用全是 404
        - id: user-service
          uri: lb://erp-user-service
          predicates:
            - Path=/api/user/**
          filters:
            - StripPrefix=1
        - id: role-service
          uri: lb://erp-user-service
          predicates:
            - Path=/api/role/**
          filters:
            - StripPrefix=1
        - id: permission-service
          uri: lb://erp-user-service
          predicates:
            - Path=/api/permission/**
          filters:
            - StripPrefix=1
        - id: department-service
          uri: lb://erp-user-service
          predicates:
            - Path=/api/department/**
          filters:
            - StripPrefix=1
        - id: order-service
          uri: lb://erp-order-service
          predicates:
            - Path=/api/order/**
          filters:
            - StripPrefix=1
        - id: product-service
          uri: lb://erp-product-service
          predicates:
            - Path=/api/product/**
          filters:
            - StripPrefix=1
        - id: platform-service
          uri: lb://erp-platform-service
          predicates:
            - Path=/api/platform/**
          filters:
            # ⚠️ 必须是 1（不是 2）：后端 controller 根是 /platform/config、/platform/sync，
            #    剥掉 /api/platform 两段后服务收到的是 /config/list，
            #    而 controller 要的是 /platform/config/list → 每个请求都 404。
            - StripPrefix=1

        # 供应商管理服务
        - id: supplier-service
          uri: lb://erp-supplier-service
          predicates:
            - Path=/api/supplier/**
          filters:
            - StripPrefix=1
        # 客户管理服务
        - id: customer-service
          uri: lb://erp-customer-service
          predicates:
            - Path=/api/customer/**
          filters:
            - StripPrefix=1
        # 报表服务
        - id: reporting-service
          uri: lb://erp-reporting-service
          predicates:
            - Path=/api/report/**
          filters:
            - StripPrefix=1
        # 采购服务
        # ⚠️ 采购单列表/详情（前端 erp-web/src/api/purchase.ts）
        #    采购单的实体与 Service 在 erp-supplier-service（另一套 /supplier/purchase/** 契约保留不动），
        #    但 purchase.ts 走的是 /purchase/orders —— 必须单独指一份路由。
        #    ⚠️ 位置很关键：本路由必须排在下面那条通配的 purchase-service 之前，
        #    Spring Cloud Gateway 是「首次匹配生效」，否则 /api/purchase/orders 会被通配路由吃掉，
        #    转发到 erp-purchase-service（那里只有 forecast/plan/quote）→ 404。
        - id: purchase-order-service
          uri: lb://erp-supplier-service
          predicates:
            - Path=/api/purchase/orders/**,/api/purchase/suppliers
          filters:
            - StripPrefix=1
        - id: purchase-service
          uri: lb://erp-purchase-service
          predicates:
            - Path=/api/purchase/**
          filters:
            - StripPrefix=1
        # 仓储管理服务
        - id: warehouse-service
          uri: lb://erp-warehouse-service
          predicates:
            - Path=/api/warehouse/**
          filters:
            - StripPrefix=1
        # 库存预警服务
        # ⚠️ 必须排在 inventory-service 前面！
        #    Spring Cloud Gateway 按声明顺序匹配路由，/api/inventory/** 会先吃掉
        #    /api/inventory/alert/**，StripPrefix=1 之后变成 /alert/**，
        #    而库存预警服务的 controller 根路径是 /inventory/alert/** → 直接 404。
        #    后端 controller 根路径 /inventory/alert/**，前端用 /api/inventory/alert/**
        - id: inventory-alert-service
          uri: lb://erp-inventory-alert-service
          predicates:
            - Path=/api/inventory/alert/**
          filters:
            - StripPrefix=1
        # 库存服务
        - id: inventory-service
          uri: lb://erp-inventory-service
          predicates:
            - Path=/api/inventory/**
          filters:
            - StripPrefix=1
        # 财务服务
        - id: finance-service
          uri: lb://erp-finance-service
          predicates:
            - Path=/api/finance/**
          filters:
            - StripPrefix=1
        # 物流服务
        # ⚠️ 这条路由之前被移除了，因为 erp-logistics-service 模块根本不存在。
        #    现已新建该模块（渠道 + 费率 + 运费计算），路由加回来。
        #    后端 controller 根路径 /logistics/**，前端用 /api/logistics/**
        - id: logistics-service
          uri: lb://erp-logistics-service
          predicates:
            - Path=/api/logistics/**
          filters:
            - StripPrefix=1

        # 社交电商服务
        # 后端 controller 根路径是 /api/v1/**（tiktok-shop / live-streams / cooperations /
        # influencers / douyin-shop），前端统一用 /api/social/**
        - id: social-commerce-service
          uri: lb://erp-social-commerce-service
          predicates:
            - Path=/api/social/**
          filters:
            - RewritePath=/api/social/(?<seg>.*), /api/v1/$\{seg}

        # AI 智能客服助手
        # ⚠️ 这条路由之前被删掉了：erp-ai-assistant-service 当时用独立父 pom
        #    （spring-boot-starter-parent 3.3.5），没 nacos-discovery 依赖 → 注册不到 Nacos。
        #    现已统一继承根 pom 并补上 nacos-discovery + discovery 配置 → 可以路由了。
        #
        #    前端 erp-web/src/api/ai.ts 用的是 /api/ai/assistant/**，
        #    后端 controller 根是 /api/v1/ai-assistant/** → 需要 RewritePath 对齐。
        #
        #    ⚠️ 顺序很重要：Gateway 按声明顺序匹配，第一条命中即生效。
        #    下面 3 条 knowledge 专用路由必须排在通配的 /api/ai/assistant/** 之前，
        #    否则 knowledge 请求会被通配路由吃掉，落到 /api/v1/ai-assistant/knowledge
        #    （那个只支持 POST），GET/DELETE 会 405。
        #
        #    前端三个动作分别对应后端不同路径：
        #      GET    /api/ai/assistant/knowledge        → /api/ai/knowledge/search
        #      POST   /api/ai/assistant/knowledge        → /api/v1/ai-assistant/knowledge
        #      DELETE /api/ai/assistant/knowledge/{id}   → /api/ai/knowledge/documents/{id}
        - id: ai-knowledge-list
          uri: lb://erp-ai-assistant-service
          predicates:
            - Path=/api/ai/assistant/knowledge
            - Method=GET
          filters:
            - RewritePath=/api/ai/assistant/knowledge, /api/ai/knowledge/search
        - id: ai-knowledge-add
          uri: lb://erp-ai-assistant-service
          predicates:
            - Path=/api/ai/assistant/knowledge
            - Method=POST
          filters:
            - RewritePath=/api/ai/assistant/knowledge, /api/v1/ai-assistant/knowledge
        - id: ai-knowledge-delete
          uri: lb://erp-ai-assistant-service
          predicates:
            - Path=/api/ai/assistant/knowledge/**
            - Method=DELETE
          filters:
            - RewritePath=/api/ai/assistant/knowledge/(?<id>.*), /api/ai/knowledge/documents/$\{id}
        - id: ai-assistant-service
          uri: lb://erp-ai-assistant-service
          predicates:
            - Path=/api/ai/assistant/**
          filters:
            - RewritePath=/api/ai/assistant/(?<seg>.*), /api/v1/ai-assistant/$\{seg}

        # 产品描述生成
        # 前端用 /api/description/**，后端 controller 根是 /api/v1/product-description/**
        - id: product-description-service
          uri: lb://erp-product-description-service
          predicates:
            - Path=/api/description/**
          filters:
            - RewritePath=/api/description/(?<seg>.*), /api/v1/product-description/$\{seg}

        # 数据分析服务
        # 后端 controller 根路径 /api/v1/analytics/**，前端用 /api/analytics/**
        - id: analytics-service
          uri: lb://erp-analytics-service
          predicates:
            - Path=/api/analytics/**
          filters:
            - RewritePath=/api/analytics/(?<seg>.*), /api/v1/analytics/$\{seg}

        # 智能定价服务
        # 后端 controller 根路径 /api/v1/pricing/**（还有 /api/v1/competitor、
        # /api/v1/price-history 两组），前端用 /api/pricing/**
        - id: pricing-service
          uri: lb://erp-pricing-service
          predicates:
            - Path=/api/pricing/**
          filters:
            - RewritePath=/api/pricing/(?<seg>.*), /api/v1/pricing/$\{seg}

        # 库存预测服务
        # 后端 controller 根路径 /api/v1/inventory-prediction/**，前端用 /api/inventory-prediction/**
        - id: inventory-prediction-service
          uri: lb://erp-inventory-prediction-service
          predicates:
            - Path=/api/inventory-prediction/**
          filters:
            - RewritePath=/api/inventory-prediction/(?<seg>.*), /api/v1/inventory-prediction/$\{seg}

        # 租户服务
        # 后端 controller 根路径本来就是 /api/tenant/**（dashboard/billing/usage/config），
        # 所以这里不能用 StripPrefix（会把 /api/tenant 砍掉）→ StripPrefix=0 原样转发。
        # 另外后端还有 /api/v1/tenant、/api/v1/auth、/api/v1/platforms，
        # 这三个通过 discovery locator（/erp-tenant-service/**）或 /api/v1/** 直连访问。
        - id: tenant-service
          uri: lb://erp-tenant-service
          predicates:
            - Path=/api/tenant/**
          filters:
            - StripPrefix=0

        # AI 订单异常检测服务 (v1.6.0)
        - id: anomaly-detection-service
          uri: lb://erp-anomaly-detection-service
          predicates:
            - Path=/api/v1/anomaly/**
          filters:
            - StripPrefix=0

        # AI 智能选品推荐服务 (v1.7.0)
        - id: product-recommendation-service
          uri: lb://erp-product-recommendation-service
          predicates:
            - Path=/api/v1/recommend/**
          filters:
            - StripPrefix=0

    sentinel:
      transport:
        dashboard: localhost:8858
        port: 8719
      eager: true

management:
  endpoints:
    web:
      exposure:
        include: '*'

logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.cloud.loadbalancer: DEBUG