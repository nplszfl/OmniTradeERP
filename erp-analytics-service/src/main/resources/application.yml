server:
  port: 8097

spring:
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_HOST:127.0.0.1}:${NACOS_PORT:8848}
        namespace: ${NACOS_NAMESPACE:erp-dev}
        group: DEFAULT_GROUP
      config:
        server-addr: ${NACOS_HOST:127.0.0.1}:${NACOS_PORT:8848}
        namespace: ${NACOS_NAMESPACE:erp-dev}
        group: DEFAULT_GROUP
        file-extension: yml
        refresh-enabled: true
  application:
    name: erp-analytics-service
  config:
    # ⚠️ 必须有这行：classpath 上有 spring-cloud-starter-alibaba-nacos-config 时，
    # Spring Cloud 的 ConfigDataMissingEnvironmentPostProcessor 会检查 spring.config.import，
    # 没配直接抛 "No spring.config.import set" 导致启动失败。
    # optional: 前缀保证 Nacos 不可达时不阻塞启动。
    import: optional:nacos:${spring.application.name}.yml
  
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/erp_order?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  

# Analytics specific configuration
analytics:
  dashboard:
    refresh-interval: 30000  # 30 seconds
    max-data-points: 1000
  prediction:
    default-forecast-days: 30
    min-historical-days: 7
  roi:
    default-period-days: 30
    currency: USD
  competitor:
    update-interval: 3600000  # 1 hour
    max-competitors: 50

# Logging
logging:
  level:
    com.crossborder.analytics: DEBUG
    org.springframework: INFO