server:
  port: 8138
  servlet:
    context-path: /

spring:
  application:
    name: erp-anomaly-detection-service

  config:
    # ⚠️ 必须有这行：只要 classpath 上有 spring-cloud-starter-alibaba-nacos-config，
    #    Spring Cloud 的 ConfigDataMissingEnvironmentPostProcessor 就会检查
    #    spring.config.import，没配就直接抛
    #    "No spring.config.import set" → 服务根本起不来。
    #    optional: 前缀表示 Nacos 不可达时不阻塞启动（降级用本地配置）。
    import:
      - optional:nacos:${spring.application.name}.yml

  profiles:
    active: dev

  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_HOST:127.0.0.1}:${NACOS_PORT:8848}
        namespace: ${NACOS_NAMESPACE:erp-dev}
        group: DEFAULT_GROUP
      config:
        server-addr: ${NACOS_HOST:127.0.0.1}:${NACOS_PORT:8848}
        namespace: ${NACOS_NAMESPACE:erp-dev}
        group: DEFAULT_GROUP
        file-extension: yml
        refresh-enabled: true

# Swagger / OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  # 健康检查 - 包含 discovery 状态（Nacos 心跳）
  health:
    discovery:
      enabled: true

logging:
  level:
    com.crossborder.anomaly: INFO
    com.crossborder.anomaly.engine: DEBUG
    com.alibaba.nacos: WARN

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    # ⚠️ MODE=MySQL 必须带：schema.sql 用的是 MySQL 方言
    #    （ENGINE=InnoDB / 内联 KEY / 反引号 / 列级 COMMENT），
    #    H2 默认（MODE=REGULAR）不认内联 KEY，会直接语法报错。
    url: jdbc:h2:mem:anomaly_dev;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    # 📌 项目权威数据库是 MySQL（docker-compose 只有 mysql:8.0，k8s 里也没有 Postgres）。
    #    之前这里指向 jdbc:postgresql://postgres:5432/erp_anomaly —— 全仓库既没有
    #    Postgres 实例，也没有 PostgreSQL 版 DDL，这个 prod profile 是纯空配置。
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/erp_anomaly?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
