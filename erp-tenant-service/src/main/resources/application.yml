server:
  port: 8095

spring:
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_HOST:127.0.0.1}:${NACOS_PORT:8848}
        namespace: ${NACOS_NAMESPACE:erp-dev}
        group: DEFAULT_GROUP
      config:
        server-addr: ${NACOS_HOST:127.0.0.1}:${NACOS_PORT:8848}
        namespace: ${NACOS_NAMESPACE:erp-dev}
        group: DEFAULT_GROUP
        file-extension: yml
        refresh-enabled: true
  application:
    name: erp-tenant-service
  datasource:
    # 📌 项目权威数据库是 MySQL（docker-compose 只有 mysql:8.0）。
    #    之前指向 jdbc:postgresql://localhost:5432/omnitrade_tenant，
    #    而仓库里既没有 Postgres 实例，也没有 PostgreSQL 版 DDL → 连不上库。
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/erp_tenant?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

jwt:
  secret: ${JWT_SECRET:OmniTradeERP Secret Key For SaaS 2026 Multi-Tenant Platform}
  expiration: ${JWT_EXPIRATION:86400000}

logging:
  level:
    com.crossborder: INFO