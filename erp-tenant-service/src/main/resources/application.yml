server:
  port: 8095

spring:
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_HOST:127.0.0.1}:${NACOS_PORT:8848}
        namespace: ${NACOS_NAMESPACE:erp-dev}
        group: DEFAULT_GROUP
      config:
        server-addr: ${NACOS_HOST:127.0.0.1}:${NACOS_PORT:8848}
        namespace: ${NACOS_NAMESPACE:erp-dev}
        group: DEFAULT_GROUP
        file-extension: yml
        refresh-enabled: true
  application:
    name: erp-tenant-service
  datasource:
    # 📌 项目权威数据库是 MySQL（docker-compose 只有 mysql:8.0）。
    #    之前指向 jdbc:postgresql://localhost:5432/omnitrade_tenant，
    #    而仓库里既没有 Postgres 实例，也没有 PostgreSQL 版 DDL → 连不上库。
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/erp_tenant?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

jwt:
  # 📌 **密钥必须由环境变量注入，不能写死在仓库里**（2026-11-12 修）
  #    🔴 修复前这里是 `${JWT_SECRET:OmniTradeERP Secret Key For SaaS 2026 Multi-Tenant Platform}`
  #    —— **默认值就在仓库里** → 任何拿到仓库的人都能签出管理员 token
  #    → 而且**部署层从来没注入过 JWT_SECRET** → 生产环境用的**就是这个默认值**。
  #    📌 这里**故意不写默认值** —— 缺变量就让它**启动失败**，比「带着已知密钥上线」安全得多。
  #    📌 部署侧注入见 k8s/extended-services.yaml（secretKeyRef: erp-jwt-secret / jwt-secret）
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:7200000}

logging:
  level:
    com.crossborder: INFO